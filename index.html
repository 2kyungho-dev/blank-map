## 7.1 DNA Replication
> ① 복사 — DNA를 어떻게 똑같이 두 벌 만드나 (S기에 genome 전체 복제)
### 7.1.1 DNA Polymerase
- DNA 복제는 <b>반보존적</b>이며 복제는 세포 주기 중 [[S|S기|S phase|synthetic phase]]기에 일어남 (Interphase = G1-S-G2 / 그 뒤 Mitosis) {src:야마,PPT}
- DNA pol은 [[dNTP|deoxyribonucleotide triphosphate|dNTPs]]의 결합을 촉진해 [[phosphodiester|포스포다이에스터]] 결합으로 사슬을 만듦 {src:야마,vault,PPT}
- 새 dNTP는 [[3′-OH|3'oh|3oh|3'-oh|3 oh]]에만 붙임 → 합성 방향 [[5′→3′|5'→3'|5'3'|53|5->3|5'-3']]만 가능 (3′-OH가 없으면 더 못 붙음) {fire:22-5} {src:vault,야마,기출,PPT}
- 시작하려면 [[primer|프라이머]]가 필요함 → RNA primer를 깔아 주는 효소 = [[primase|프라이메이스]] {fire:} {src:vault,야마,기출}
- leading과 lagging 모두 DNA 합성이므로 <b>둘 다</b> [[primer|프라이머]] strand가 필요함 (leading은 1개, lagging은 여러 개) {fire:25-1} {src:야마,기출}
- primer 없이 de novo 시작 가능한 것 = [[RNA pol|rna polymerase|rnapolymerase|rnapol|rna 중합효소]] / 반면 [[reverse transcriptase|rt|역전사효소]]는 primer가 필요함 (원핵 DNA pol도 primer 필요!) {fire:22-2} {src:vault,야마,기출}
- AZT: 3′ 자리가 OH 대신 [[N₃|n3|azide|아자이드]] → 다음 dNTP 못 붙음 = chain termination → 표적 = HIV [[reverse transcriptase|rt|역전사효소]] {src:vault,야마,PPT}
- retrovirus 게놈의 3개 유전자 = gag · [[pol]] · env (pol = 역전사효소 유전자) {src:vault,PPT}
### 7.1.2 Replication Process
> replication fork · leading/lagging · Okazaki fragment · 효소/단백질 총정리
#### 7.1.2.a Replication fork와 두 가닥
- replication fork = 이중나선이 갈라지는 분기점이며 복제는 [[bi-directional|양방향|bidirectional|양방향성]]으로 진행 (origin 하나에서 양쪽으로) {src:vault,야마,기출}
- 연속 합성 = [[leading|leadingstrand]] strand (primer 1개) / 조각 합성 = [[lagging|laggingstrand]] strand → 조각 이름 [[Okazaki fragment|okazaki|okazakifragments]] {fire:21-1} {src:기존,야마,기출}
- lagging이 조각인 이유 = 합성 방향이 fork 진행 방향과 [[반대|opposite|역방향]] → primer를 계속 새로 깔아야 함 {src:기존,야마}
- Okazaki fragment 길이: 포유류 약 [[200|200bp]]bp / 효모 약 [[2kb|2000|2 kb|2,000]] {src:야마,PPT}
- Okazaki fragment는 <b>lagging</b> strand에서 생기며 leading에서 생긴다는 선지는 오답 → 조각들은 [[DNA ligase|ligase|리게이스]]가 이어 줌 {fire:22-2} {src:야마,기출}
#### 7.1.2.b Okazaki fragment 합성과 primer 제거
- Okazaki 합성 ① [[primase|프라이메이스]]가 RNA primer 합성 (primase는 pol과 달리 primer 없이 NTP를 붙일 수 있음, 5′→3′, RNA에는 T 대신 [[U|uracil|우라실]]) {src:야마,PPT,기출}
- Okazaki 합성 ② DNA pol이 RNA 뒤를 이어 DNA 연장 → 이 RNA-DNA 복합체가 [[Okazaki fragment|okazaki|okazakifragments]] {src:야마}
- 조각 완성 3단계 = 연장 → [[primer 제거|primer제거|primerremoval|프라이머제거]] → 잇기 {fire:} {src:기존,야마}
- Current(시험 기준): δ가 멈추지 않고 밀어 올림(strand-displacement) → [[flap|플랩]] → [[FEN1|fen-1|flap endonuclease 1]]이 절단 → [[DNA ligase|ligase|리게이스]]가 nick 봉합 {src:기존,야마,PPT}
- Old(교재): δ가 멈춤 → [[RNase H|rnaseh|rnase-h]]가 RNA 제거(RNA-DNA hybrid의 RNA를 자르는 endonuclease) → gap을 δ가 채움 → ligase {fire:22-2} {src:기존,야마,PPT}
- 원핵(E. coli)은 primer 제거와 gap 채우기 모두 Pol [[I|1|Ⅰ]]이 담당 (5′→3′ exonuclease로 RNA 제거 + DNA 추가) {fire:21-1} {src:야마,기출}
#### 7.1.2.c DNA polymerase 정리
- 핵 pol 분담: leading = Pol [[ε|epsilon|엡실론|e]] / lagging = Pol [[δ|delta|델타|d]] / primase와 복합체 = Pol [[α|alpha|알파|a]] (짧게 합성하고 떠남) {fire:25-4} {src:기존,야마,기출,PPT}
- lagging strand의 <b>priming</b>에 관여하는 pol = Pol [[α|alpha|알파|a]] ( primase/pol α 복합체 → 짧은 DNA 연장 뒤 δ가 이어 길게 합성) {fire:25-5} {src:야마,기출}
- E. coli: leading·lagging 모두 Pol [[III|3|Ⅲ]], primer 부착 = [[primase|프라이메이스]], 제거 = Pol I {fire:22-2} {src:야마,vault}
- 미토콘드리아 DNA = Pol [[γ|gamma|감마|g]] (세균 pol 억제 항생제가 미토콘드리아를 손상시키는 문제의 답) {src:기존,PPT,vault}
- BER 빈칸 하나 채우기 = Pol [[β|beta|베타|b]] (복제 fork에는 관여 안 함) {src:기존,vault}
- translesion pol = [[ζ|zeta|제타]] · [[η|eta|에타]] · ι · κ (low fidelity, DNA에 느슨하게 결합) {src:기존,vault,야마}
- <b>telomerase(TERT)</b>도 DNA pol의 한 종류로서 [[reverse transcriptase|rt|역전사효소]] 활성을 가짐 {fire:22-4} {src:vault,PPT}
#### 7.1.2.d 복제에 관여하는 단백질
- 이중나선 풀기 = [[helicase|헬리케이스]] (복제 fork 앞에서 풂) → 풀린 ssDNA 보호 = [[RPA|replication protein A|ssb]] → 앞쪽 꼬임 해소 = [[topoisomerase|topo|토포이소머레이스]] (끊고·돌리고·잇기) {fire:22-1} {src:기존,야마,기출}
- topoisomerase는 helicase 앞에서 당-인산 결합을 끊었다 붙이는 <b>swivel</b>로 [[supercoiling|super coiling|supercoil|초나선]]을 방지하며, 이중나선을 자르고 잇는 일은 helicase가 아니라 topo의 일 {fire:22-3} {src:야마,기출}
- sliding clamp = [[PCNA]] (<b>homotrimer</b> 반지, pol δ·ε와 결합) → 끼우는 로더 = [[RFC|replication factor c]] / 빼는 언로더 = [[ATAD5|atad5-rlc]]-RLC {fire:25-2} {src:기존,야마,기출,PPT}
- clamp loader RFC는 PCNA 반지를 열어 ssDNA/dsDNA junction의 [[3′-OH|3'oh|3oh|3'-oh]]가 있는 primer 자리에 PCNA를 얹음 (RFC는 단백질 [[5|5개]]개로 구성) {fire:25-3} {src:야마,PPT,기출}
- PCNA 덕분에 떨어지지 않고 길게 합성하는 성질 = [[processivity|프로세시비티]] (PCNA에 실리는 단백질 150개+) {src:기존}
- leading strand에서는 PCNA loading이 [[1|1번|한 번]]번, lagging strand에서는 Okazaki fragment마다 loading/unloading 반복 {src:야마}
### 7.1.3 The Fidelity of Replication
- 오류율 = 10의 [[9|9승|10^9]]승당 1개 미만 → 사람 게놈 한 번 복제에 약 [[3|3개|세개]]개 (3×10⁹ bp, 약 2 m) {src:기존,PPT,야마}
- 맞는 dNTP가 왔을 때만 pol이 꽉 닫힘 = [[conformational change|conformationalchange|구조변화]] → 정확도 약 [[1000|천|1000배|1,000]]배 증가 {src:기존,PPT,야마}
- 틀린 걸 되돌아가 잘라 냄 = [[proofreading|교정]] = [[3′→5′ exonuclease|3'→5'exonuclease|3'5'exonuclease|35exonuclease|3'-5'exonuclease|exonuclease|3'5'exo]] 활성 {src:기존,PPT,야마}
- proofreading 활성이 있는 pol = 진핵 [[δ|delta|델타]] · [[ε|epsilon|엡실론]] / E. coli Pol [[III|3|Ⅲ]] / 반면 Pol α는 proofreading이 [[없다|없음|x|no|없]] {fire:25-1} {src:야마,기출,vault}
- proofreading을 거치면 약 10⁷~10⁸ nucleotide당 mismatch 1개 수준, 이후 남은 오류는 [[mismatch repair|mmr]]이 해결 {src:야마}
- E. coli에서 proofreading은 Pol [[III|3|Ⅲ]]이 모두 해결한다고 봄 (Pol I만으로 가능하다는 선지는 오답) {fire:21-4} {src:야마,기출}
### 7.1.4 Origins and the Initiation of Replication
- 복제는 origin(ori)에서 [[양방향|bi-directional|bidirectional]]으로 시작 / E. coli = 원형 염색체 1개, origin [[1|1개|한개|하나]]개 / 사람 = 선형 염색체 [[46|46개]]개, <b>염색체 하나에 origin 여러 개</b> (origin 수가 46개라는 선지는 오답) {fire:25-1} {src:기존,PPT,기출}
- genome 크기: E. coli 약 [[4.6×10⁶|4.6x10^6|4.6 x 10^6|460만]] bp vs 사람 약 3.2×10⁹ bp → 진핵은 origin이 많아야 빠르게 복제 {src:PPT}
- E. coli 개시: [[initiator protein|initiator|개시단백질]]이 ori에 결합 → DNA를 살짝 풂 → [[helicase|헬리케이스]] 결합 → SSB 결합 + RNA primer 합성 → DNA 합성 {src:vault,야마,PPT}
- 효모 origin 서열 = [[ARS|autonomously replicating sequence]] (플라스미드에 넣으면 스스로 복제하는 서열) → 핵심 [[11|11bp|11개]]염기 서열 = ACS {src:기존,vault,야마,PPT}
- ACS를 알아보는 복합체 = [[ORC|origin recognition complex]] → 여는 helicase = [[MCM]] (켜지는 시기 [[S|s기|s phase]]기) {fire:} {src:기존,야마,기출}
- 사람 ORC는 효모보다 더 [[복잡|다양|complex]]하게 존재하고, 다른 진핵생물의 origin은 chromatin 구조로 결정되는 듯 명확하지 않음 {fire:22-3} {src:야마,PPT}
### 7.1.5 Telomeres and Telomerase
> 선형 염색체의 끝을 지키고 늘리기
#### 7.1.5.a 말단 복제 문제와 telomere
- 선형 DNA 끝은 [[exonuclease|엑소뉴클레이스|exo]] 공격에 취약 (endonuclease = 한가운데를 자름 / exonuclease = 끝에서부터 하나씩) → 원형 E. coli는 끝이 없어 보호됨 {src:vault,야마,PPT}
- 선형 끝이 매번 짧아짐 = [[end-replication problem|endreplicationproblem|end replication problem|말단복제문제]] (마지막 primer 자리를 채울 3′-OH가 없음) {src:기존,야마,PPT}
- telomere의 3′ 단일가닥 overhang은 안쪽 반복서열과 상보 결합해 고리를 만들고, 이 [[T-loop|tloop|t loop]]가 끝을 숨겨 exonuclease 공격을 차단 {src:야마,PPT}
- telomere = [[TTAGGG]] 반복 + 보호 복합체 [[shelterin|셸테린]] + 3′ 끝이 숨는 [[T-loop|tloop|t loop]] {src:기존,vault,야마,PPT}
#### 7.1.5.b Telomerase와 세포 종류별 차이
- telomerase = 자기 [[RNA|rna template]] template(telomere 반복과 상보적) + 역전사효소 [[TERT]] → 3′ 연장 → 반대 가닥은 lagging 방식 {fire:25-7} {src:기존,야마,기출,PPT}
- 연장 순서: ① 3′ overhang에 telomerase의 RNA template가 상보 결합 → ② 역전사로 one repeat unit 연장 → ③ [[primase|프라이메이스]]와 DNA pol이 5′ 가닥을 연장 {fire:21-3} {src:야마,기출}
- telomerase는 <b>RNA</b> template를 가진 역전사효소이며 (DNA template나 RNA polymerase가 아님) 합성하는 쪽은 [[lagging|laggingstrand]]쪽으로 설명됨 {fire:22-4} {src:야마,기출}
- 생식세포(germ cell)에는 TERT가 있어 길이 유지 / 체세포에는 telomerase가 [[없음|없다|x|no|부족]] → 분열마다 짧아짐 {src:vault,야마,PPT}
- 체세포는 → [[replicative senescence|senescence|복제노화|노화]] 또는 cell death / 암세포는 telomerase 활성 회복 {src:기존,야마}
### 7.1.6 Chromatin Replication
- histone octamer = H2A·H2B·H3·H4 각 [[2|2개|두개]]개 → DNA는 음전하, histone은 [[Lys|lysine|라이신|k]]·Arg가 많아 양전하 {src:기존,야마,PPT}
- Lys [[acetylation|아세틸화|acetyl]] → 양전하 소실 → DNA와의 결합력↓ → 풀림 (효소 [[HAT|hats]]) / 다시 감기 = [[HDAC|hdacs|hd]] {src:기존,야마,PPT}
- 복제 후 하나의 dsDNA가 둘이 되므로 nucleosome 밀도 유지에는 [[histone|히스톤]] 단백질이 더 많이 필요 {src:야마}
- 복제 후 nucleosome 밀도를 유지하려면 기존 histone [[recycling|재활용|recycle]] + 새 histone deposition이 필요 (octamer가 열린 뒤 DNA 합성) {src:기존,야마}
## 7.2 DNA Repair
> ② 고치기 — 망가지면 어떻게 고치나: 손상 모양에 따라 방법이 갈림
### 7.2.1 DNA Damage의 종류
- 손상 원인: 활성산소(ROS) → [[SSB|single-strand break|single strand break]] / 이온화 방사선 → [[DSB|double-strand break|double strand break]] / 자외선 → pyrimidine dimer {src:PPT,야마}
- deamination: 하루 세포당 약 [[10⁴|10^4|10000|1만]]번 → C→[[U|uracil|우라실]], A→[[hypoxanthine|히포잔틴]] (G→xanthine이며 'G→hypoxanthine'은 오답) {fire:22-5} {src:기존,PPT,야마,기출}
- C가 deamination되어 생긴 U는 [[A|adenine|아데닌]]와 염기쌍을 이룸 {fire:25-9} {src:야마,기출}
- alkylation: Guanine → O⁶-methylG는 C 대신 [[T|thymine|티민]]과 염기쌍을 이룸 {fire:25-10} {src:기존,vault,야마,기출}
- UV는 인접한 pyrimidine끼리 결합한 [[pyrimidine dimer|thymine dimer|t dimer|tt dimer|티민 이량체|피리미딘 이량체]]를 만듦 (UV가 DSB·SSB를 주로 만든다는 선지는 오답) {fire:25-14} {src:vault,야마,기출}
- 발암물질(예: [[벤조피렌|benzopyrene|benzoapyrene]]) → DNA 염기에 <b>bulky group</b> 부가 / UV 이량체·bulky group은 backbone을 크게 변형시켜 base만 떼어 낼 수 없음 → NER {src:vault,야마}
- XP(Xeroderma Pigmentosum) = [[NER|nucleotide excision repair]] 결함 → 햇빛 극민감·다발성 피부암 (BER 결함이 아님) {fire:25-11} {src:기존,vault,야마,기출}
- 복제 중 mismatch는 proofreading과 conformational change에도 남는 오류 → [[MMR|mismatch repair]] {src:vault,야마}
- 2015 노벨 화학상: Lindahl = [[BER|base excision repair]] / Modrich = [[MMR|mismatch repair]] / Sancar = [[NER|nucleotide excision repair]] {src:PPT}
### 7.2.2 Base Alteration Repair
> 한 가닥 손상 ① — direct reversal과 BER
- O⁶-methylG → [[direct reversal|directreversal|직접복구]] → 효소 [[O⁶-methylguanine methyltransferase|o6-methylguaninemethyltransferase|methylguaninemethyltransferase|methyltransferase|mgmt]] (절단 없이 methyl기를 직접 제거, minor) / 안 고치면 짝이 C 대신 [[T|thymine|티민]] {src:기존,vault,야마}
- direct reversal은 [[포유동물|사람|mammal|mammalian]]에도 존재함 (존재하지 않는다는 선지는 오답) {fire:22-5} {src:야마,기출}
- BER는 alkylation·deamination 같은 염기 손상 및 SSB를 고치는 [[major|주된|주요]] 경로 (direct reversal은 minor)이며 SSB repair와 후반부가 비슷함 {src:야마}
- BER 1단계: [[DNA glycosylase|glycosylase|글리코실레이스]]가 잘못된 염기(예: uracil)를 인식해 염기-당 결합을 끊어 제거 → [[AP site|apsite|ap|apurinic/apyrimidinic site]] {fire:25-8} {src:기존,야마,기출,PPT}
- BER 2단계: [[AP endonuclease|apendonuclease]]가 AP site의 3′ 쪽을 자름 (= SSB 상태). AP site를 <b>만드는</b> 것은 glycosylase이지 AP endonuclease가 아님 {fire:22-5} {src:기존,야마,기출}
- BER 3단계: [[deoxyribosephosphodiesterase|dRPase|deoxyribose phosphodiesterase|deoxyribosephosphodiesterase 활성]]가 5′ 쪽을 끊어 deoxyribose 제거 → Pol [[β|beta|베타|b]] + [[DNA ligase|ligase|리게이스]]가 채움·봉합 {src:기존,vault,야마,PPT}
- BER 중에는 [[SSB|single-strand break]]가 생기며 (DSB가 생긴다는 선지는 오답), primase가 복구하는 것도 아님 {fire:25-8} {src:야마,기출}
### 7.2.3 UV / Bulky Adduct Repair
> 한 가닥 손상 ② — NER은 backbone째 oligonucleotide로 절제
- UV T dimer → [[NER|nucleotide excision repair]] (손상 앞뒤 oligonucleotide를 통째로 절제) {fire:25-14} {src:기존,야마,기출,PPT}
- (심화) photoreactivation = 가시광선 에너지로 cyclobutane 고리를 깨서 dimer를 직접 해소 → [[태반포유류|placental mammals|태반 포유류|사람]]는 이 기전을 못 씀 {fire:22-5} {src:vault,야마,기출}
- (심화) E. coli의 NER = UvrABC [[excinuclease|엑시뉴클레이스|exinuclease]]가 oligonucleotide를 직접 절제 {fire:21-5} {src:야마,기출}
- GG-NER 1~2단계: 손상 인식(backbone 휘어짐) = [[XPC]] → [[XPA]] + RPA가 손상 맞은편에 결합 {src:기존,vault,야마,PPT}
- GG-NER 3단계: TFIIH의 helicase [[XPB]]·[[XPD]]가 이중나선을 풂 {src:기존,vault,야마}
- GG-NER 4~5단계: endonuclease [[XPG]]·[[XPF]](-ERCC1)가 양쪽을 잘라 oligo를 절제 → pol + ligase가 gap 채움 + nick 봉합 {src:기존,vault,야마}
- [[gap|갭]] = 빈 염기 존재 / [[nick|닉]] = 빈 염기 없이 결합만 안 된 상태 {src:야마}
- TC-NER(전사 중 RNA pol이 멈춘 곳)에서는 RNA pol이 손상을 인식하고 [[CSB]](·CSA)를 동원, 이후는 같은 과정 (XPC 자리를 CSB가 대체) {fire:19-6} {src:기존,야마,기출}
- TC-NER는 BER의 한 종류가 아니라 [[NER|nucleotide excision repair]]의 한 종류임 {fire:21-6} {src:야마,기출}
- NER 결손 질병 = [[xeroderma pigmentosum|xp|색소성건피증]] (햇빛 극민감·피부암) {fire:25-11} {src:기존,야마,기출,PPT}
### 7.2.4 Mismatch Repair
> 한 가닥 손상 ③ — 복제 후 남은 mismatch
- 복제 후 남은 mismatch → [[MMR|mismatch repair]]: E. coli [[MutS]]가 mismatch 인식 → MutL → [[MutH]]와 복합체 형성 {src:기존,야마,PPT}
- MutH endonuclease는 아직 [[methylation|메틸화|methyl]]되지 않은 new strand의 [[GATC]] 서열에서 nick을 냄 {fire:22-6} {src:기존,야마,기출}
- 이후 MutL·MutS가 [[exonuclease|엑소뉴클레이스|exo]]와 helicase를 데려와 nick부터 mismatch까지 제거 → pol + ligase {src:야마,vault}
- 새 가닥을 구별하는 표지 = 아직 methylation 안 됨 → MMR은 methylation된 <b>old</b> strand가 아니라 [[new|새|신생|newly synthesized]] strand의 mismatch를 고침 {fire:21-6} {src:기존,야마,기출}
- 포유류에서는 [[MSH|MutS homolog]](MutS homolog)와 [[MLH|MutL homolog]](MutL homolog)가 mismatch에 결합 → mismatch와 nick 사이 DNA 제거 → repair {fire:25-13} {src:야마,vault,기출}
- 포유류에서는 새로 복제된 DNA의 [[single-strand break|nick|SSB|단일가닥 절단]]이 고칠 가닥을 알려 줌 {src:PPT}
- 사람 MSH·MLH 결손 = [[Lynch syndrome|lynch|hnpcc]] (HNPCC, 유전성 비용종성 [[대장암|colorectal cancer|colon cancer]]) {fire:25-13} {src:기존,야마,기출}
### 7.2.5 Translesion DNA Synthesis
> 못 고치고 넘어가기
- lesion을 만나면 high-fidelity pol([[α|alpha]]·δ·ε)은 정지 / low-fidelity pol은 일단 통과 → 이 기전 = [[TLS|translesion synthesis|translesion DNA synthesis]] {fire:25-16} {src:기존,야마,기출}
- low-fidelity pol은 DNA와 [[느슨하게|loose|loosely]] 결합하고 proofreading이 없어 lesion을 통과 가능 (tight 결합 = high fidelity) / 통과 후 손상은 excision repair로 수정 {src:vault,야마}
- 진핵 TLS 스위치 = PCNA [[mono-ubiquitination|monoubiquitination|monoubiquitylation]] (효소 [[RAD6|rad6a|rad6b]]; poly-Ub = 분해 신호와 구분) {src:기존,야마,PPT}
- TLS pol 4개 = ζ · [[η|eta|에타]] · ι · κ → TT 맞은편에 AA를 정확히 넣는 건 [[η|eta|에타]] {src:기존,vault,야마}
- 끝나면 [[deubiquitination|탈유비퀴틴화|deubiquitylation]] (USP1/UAF1) → 원래 정상 pol 복귀 {src:기존,vault,야마}
- E. coli에서는 Pol [[V|5|Ⅴ]]가 손상 부위를 임시 통과한 뒤 Pol III에 넘김 (II·IV도 비슷) / 진핵에도 TLS는 있음 {fire:22-5} {src:야마,기출}
### 7.2.6 Repair of Double-Strand Breaks
> 두 가닥 손상 — NHEJ vs HR
#### 7.2.6.a NHEJ와 HR의 비교
- DSB 복구 시스템 2개 = [[NHEJ|non-homologous end joining]]와 [[HR|homologous recombination]] {fire:25-15} {src:기존,야마,기출}
- NHEJ: 끊어진 말단을 그대로 이어 붙임 → 세포 주기와 [[무관|상관없이|아무 때나|언제나|g1sg2]], 부정확(insertion·deletion) → 지키는 단백질 [[53BP1|53bp-1]] {fire:} {src:기존,야마,기출}
- NHEJ의 부정확함(insertion·deletion)은 V(D)J 접합의 항체 다양성에 이용됨 ([[error-prone|오류유발|error prone]]한 성질 활용) {src:야마}
- HR: [[S/G2|sg2|s g2|s·g2|s,g2]]기에만, 주형 = [[sister chromatid|sisterchromatid|자매염색분체]] → 정확하지만 느려서 NHEJ보다 적게 일어남 → sister chromatid를 이용한 복구 {fire:25-12} {src:기존,야마,기출}
- G1에는 sister chromatid가 없어 resection이 일어나면 엉뚱한 서열과 짝지을 수 있음 → G1은 [[NHEJ]]가 적합 / S·G2는 [[HR]]이 적합 {src:야마,vault}
- HR 진입 결정 = [[BRCA1]]이 resection을 촉진해 HR 유도 vs [[53BP1]]이 resection을 막아 NHEJ 유도 (서로 경쟁·억제) {src:기존,야마,vault}
#### 7.2.6.b HR 단계
- HR ① nuclease가 [[5′|5'|5prime]] 쪽 가닥을 깎아 [[3′|3'|3prime]] 단일가닥 꼬리 생성 = [[resection|절제|nuclease digestion]] → [[RPA]] 코팅 {fire:} {src:기존,야마,vault}
- HR ② [[BRCA2]]가 RPA를 밀어내고 [[RAD51]]을 loading → RAD51-ssDNA filament {fire:25-17} {src:기존,야마,vault,기출}
- HR ③ filament가 sister chromatid의 상동 서열을 찾아 이중나선 사이로 [[strand invasion|invasion|가닥 침투]] → 파고든 가닥의 3′-OH에서 DNA 합성 {src:기존,야마,vault}
- HR ④ second end capture → 양쪽이 연결된 crossed-strand intermediate = [[Holliday junction|hollidayjunction|holliday]] → ⑤ 잘라서 분리·ligation으로 복구 완료 {fire:} {src:기존,야마,vault}
- 왜 3′ 꼬리? 파고든 뒤 합성이 [[3′-OH|3'oh|3oh|3'-oh]]에서 시작하니까 (DNA pol 한계 재소환) {src:기존,야마}
- 핵심 단백질: 원핵 = [[RecA]] / 진핵 = [[RAD51]] (둘 다 ssDNA에 filament를 만들고 가닥 교환 촉매) {src:야마,vault,기출}
#### 7.2.6.c 임상: BRCA와 Synthetic Lethality
- BRCA1: DSB를 [[HR|homologous recombination]] 쪽으로 보내는 단백질 / BRCA2: RPA 덮인 ssDNA에 [[RAD51]]을 올림 → 변이 시 유방암·난소암 위험↑ {fire:25-17} {src:기존,야마,vault,기출}
- [[synthetic lethality|합성치사]]: 두 유전자 중 하나만 없으면 생존하지만 둘 다 없으면 사멸 {src:기존,야마,vault}
- BRCA 결손 암 + [[PARP inhibitor|parp|parpinhibitor|PARP 저해제]] = 표적 항암제 (Gene B = PARP) {src:기존,야마,vault}
- 평소 [[PARP|parp1]]가 SSB를 복구 → PARP 저해 시 SSB가 남아 S기에 fork와 만나 [[DSB|double-strand break]]가 됨 {src:vault,야마}
- 암세포 = BRCA 결함이라 DSB도 못 고침 → 사멸 / 정상세포 = [[HR|homologous recombination]]로 DSB 복구 → 생존 {src:vault,야마}
## 7.3 DNA Rearrangements and Gene Amplification
> ③ 일부러 바꾸기 — 세포가 일부러 DNA를 옮기고·자르고 붙이고·늘리는 경우
### 7.3.1 Chromosomal Rearrangement
- 재조합 구분: homologous = 가닥은 교환하지만 유전자 순서는 안 바뀜 → rearrangement [[아님|x|아니다|no]] / nonhomologous = 서로 다른 서열 사이에서 끊고 교환 {src:기존,야마}
- 염색체 재배열 종류 = deletion · duplication · [[inversion|역위]] · insertion · [[translocation|전좌]] (병적인 case) {src:vault,야마}
- 특정 서열 두 자리에서 끊고 교환 = [[site-specific recombination|sitespecific|sitespecificrecombination]] {fire:} {src:기존,야마,기출}
- 예: λ phage [[att]] × E. coli att, 효소 = [[integrase|인테그레이스]] {src:기존,야마}
- CML은 돌연변이 누적이 아닌 단 한 번의 [[translocation|전좌]]만으로 발생 {src:vault,야마}
- t(9;22) = [[Philadelphia chromosome|philadelphia|필라델피아]] → [[CML|chronic myelogenous leukemia|chronic myeloid leukemia|만성골수성백혈병]] → 융합 유전자 [[bcr-abl|bcrabl|bcr abl]] (tyrosine kinase가 계속 켜짐) {fire:} {src:기존,야마,vault}
- 9번의 [[abl|ABL]] 유전자와 22번의 [[bcr|BCR]] 유전자가 융합 → BCR-ABL kinase가 growth factor 신호 없이 항상 활성 → cell cycle이 계속 돌아 끝없이 증식 {src:vault,야마}
- 치료제 성분명 [[imatinib|이매티닙]] / 상표명 [[Gleevec|글리벡|glivec]] → BCR-ABL의 [[ATP]] 결합 자리를 막는 표적 항암제 {src:기존,야마,vault}
### 7.3.2 Transposition
- [[transposition|transposon|트랜스포지션]] = genetic element가 genome 안에서 위치를 옮기는 DNA rearrangement (효소 [[transposase]]) → 발견 = [[McClintock|mcclintock|맥클린톡|Barbara McClintock]]의 옥수수 (노벨상) {fire:25-18} {src:기존,야마,기출}
- 보라색 색소 유전자에 [[Ds|dissociation]]가 삽입되면 유전자가 망가져 white kernel {src:vault,야마}
- 자율 = [[Ac|activator]] (transposase를 암호화) / transposase가 없어 의존 = [[Ds]] → 점박이 = 발생 중 일부 [[세포|cell]]에서 Ds가 빠짐 {fire:} {src:기존,야마,기출}
- 사람 게놈: exon [[1.5|1.5%]]% / TE 및 TE-like 반복서열 [[44|44%]]% / 활성 TE [[0.05|0.05%]]% 미만 {fire:} {src:기존,야마,기출}
- 남은 TE는 promoter·enhancer로 작용하거나 [[microRNA|mirna]] 서열, [[poly A|polyA|polyA tail signal|poly A tail]] signal을 제공 {src:vault,야마}
### 7.3.3 Site-Specific Recombination
> 면역 다양성의 원천: B cell/T cell 발달 중 DNA 재배열
#### 7.3.3.a 면역계와 Tonegawa 실험
- 체액성 면역: B cell이 항원을 만나 clonal expansion → [[plasma cell|형질세포]](항체 분비) / [[memory B cell|memory b|기억 B 세포]] {src:vault,야마}
- 세포성 면역: [[helper T cell|helper t|th]]는 cytokine으로 B cell·CTL을 도움 / [[CTL|cytotoxic T lymphocyte]]는 감염 세포를 직접 죽임 {src:vault,야마}
- 한 개체는 약 10<sup>11</sup>가지 이상의 서로 다른 항체를 만들 수 있음 → 다양성 = [[site-specific recombination|sitespecific]] + [[somatic hypermutation|shm|체세포과돌연변이]] {fire:25-19} {src:vault,야마,기출}
- 증명 실험 = [[Tonegawa|토네가와]]의 [[Southern blot|southern|서던블롯]] (embryo = 재조합 전 vs plasmacytoma = 재조합 후; 1987 노벨상) {src:기존,vault,야마}
- Tonegawa 결과: embryo 8.6 + 5.6 kb → plasmacytoma [[3.4|3.4kb]] kb 하나 → V와 C가 한 조각으로 모임 {src:기존,vault,야마}
- 3′-half probe(C만 탐지)는 embryo에서 [[8.6|8.6kb]] kb만 → 8.6 = C 조각, 나머지 5.6 = V 조각 {src:vault,야마}
#### 7.3.3.b 항체 구조와 V(D)J
- immunoglobulin = heavy chain 2개 + light chain 2개 ([[disulfide|이황화]] 결합), 각 chain은 N-말단 variable / C-말단 constant region {src:vault,야마}
- light chain: V [[150|150개]]개 · J [[4|4개]]개 → 150×4 = [[600|600가지]]가지 / heavy chain: V 150 · D [[12|12개]]개 · J 4 → 150×12×4 = [[7200|7,200]]가지 → 조합 약 4×10<sup>6</sup> {src:vault,야마}
- [[V(D)J recombination|vdjrecombination|vdj|v(d)j]] = site-specific → 효소 [[RAG1/2|rag|rag1|rag12|rag1,2]]가 [[RS|recombination signal|rss]] 서열 인식 → DSB → [[NHEJ]]식 접합 {fire:} {src:기존,야마,vault}
- heavy chain 순서 = [[D–J|dj|d-j]] 먼저 → V–DJ / 남은 J는 RNA에서 [[splicing|스플라이싱]]으로 제거 {fire:} {src:기존,야마}
- 접합이 error-prone이라 deletion과 [[TdT|terminal deoxynucleotide transferase|terminal deoxynucleotidyl transferase]]의 insertion으로 다양성이 100배 이상 증가 {src:vault,야마}
- T cell receptor: α chain = [[V–J|vj|v-j]] recombination (light chain형) / β chain = V–[[D–J|vdj|v(d)j]] recombination (heavy chain형) {src:vault,야마}
#### 7.3.3.c Class Switch Recombination
- [[class switch recombination|classswitch|classswitching|classswitchrecombination]]: 처음 class = [[IgM]], 재조합은 [[S|switch|s region]] region끼리, 각 C region의 upstream에 위치 {fire:} {src:기존,야마,vault}
- class switch는 heavy chain의 [[constant|c]] region을 바꾸는 것이므로 variable region·다양성은 [[그대로|같다|안바뀐다|변화없음|same]] → 항체 다양성 기여 2가지 답은 V(D)J와 SHM, class switch 아님 {fire:25-19} {src:기존,야마,기출}
- Sμ와 다른 S region 사이에서 재조합 → 사이 DNA가 고리로 떨어져 나가므로 class switch는 [[한 방향|일방향|irreversible]]으로만 일어남 {src:vault,야마}
- IgG = 혈청 Ig의 약 [[80|80%]]% · IgA = 점막·침·모유 (2량체) · IgM = 5량체, 보체 활성화 · IgD = basophil·mast cell에 결합 {src:vault,야마}
- 알레르기(과활성) 관련 class = [[IgE|이지이]] (기생충 방어) {fire:25-20} {src:vault,야마,기출}
### 7.3.4 Somatic Hypermutation
- 활성화된 B cell의 rearrangement가 끝난 V region에 point mutation을 일으키는 과정, 자연 돌연변이의 약 [[100만|10^6|1000000|백만|백만배]]배 빈도 {fire:25-19} {src:vault,야마,기출}
- SHM은 DNA 재배열이 아니라 [[point mutation|점돌연변이|점 돌연변이]]이므로 DNA rearrangement에 속하지 않음 (그러나 다양성을 높임) {src:vault,야마}
- 시작 효소 [[AID|activation-induced cytidine deaminase|activationinduceddeaminase]] = activation-induced cytidine deaminase, 반응 [[C→U|cu|c-u|c->u|ctou]] {fire:} {src:기존,vault,야마}
- AID가 V region에 작용 → U를 BER로 제거 → 빈자리를 [[error-prone|오류유발|error prone]] DNA pol이 채움 → [[somatic hypermutation|shm|체세포과돌연변이]] {src:기존,vault,야마}
- AID가 S region에 작용 → 양쪽 가닥 가까운 C를 U로 바꿈 → BER로 제거되며 [[DSB|double-strand break]] 발생 → class switch {src:vault,야마}
### 7.3.5 Gene Amplification
- [[gene amplification|geneamplification|유전자증폭]] = 같은 origin에서 복제를 [[다시|반복|여러번|again]] 시작해 특정 유전자의 copy 수를 늘림 (genome 구조가 바뀌므로 DNA rearrangement의 예) {src:기존,vault,야마}
- 정상 예 = 양서류 알의 [[rRNA|rrna유전자]] 유전자 (초기 발생 때 증폭, 약 100만 copy까지) {src:기존,vault,야마}
- 정상 예 = [[Drosophila|초파리]] 난소 세포의 [[eggshell|알껍질|egg shell]] protein 유전자 증폭 {src:vault,야마}
- 병적 예 = 암세포의 [[oncogene|암유전자|oncogeneamplification]] 증폭 (예: ABL 증폭 → 세포주기 계속 회전) {fire:} {src:기존,vault,야마}
- 유전자 copy 수가 늘어난 만큼 [[발현량|expression|발현]]도 증가 {src:vault,야마}

## 8.1 Transcription in Bacteria
> RNA를 언제·어디서·어떻게 만드나 — E. coli가 모델 (PPT 2-20)
### 8.1.1 RNA polymerase
- Transcription은 gene expression의 [[첫|1|첫번째|first]] 단계이며, 발현 조절이 일어나는 첫 수준이다 {src:PPT,야마}
- RNA pol은 [[DNA|dna template]] template에 맞춰 NTP를 [[5′→3′|5'→3'|5to3|5′ to 3′]] 방향으로 중합 → DNA pol과의 공통점 2가지 {fire:23-1} {fire:20-2} {src:야마,기출,PPT}
- DNA pol과 달리 RNA pol은 [[primer|프라이머]] 없이 [[de novo|denovo]]로 시작할 수 있음 {fire:23-1} {fire:16이전-1} {star:교수 강조} {src:야마,기출,PPT}
- RNA pol의 ribonucleotide 기질 = [[NTP|ribonucleoside 5′-triphosphate|ribonucleoside triphosphate|rNTP]] (DNA pol은 dNTP) {src:PPT}
- 세균 RNA pol의 subunit 5종류 = α, β, β′, [[ω|omega|오메가]], σ {src:야마,PPT}
- 이 중 transcription 시작 site를 정확히 찾는 subunit = [[σ|sigma|시그마]] {fire:22-1} {fire:19-1} {src:야마,기출,PPT}
- 대부분의 세균은 여러 종류의 σ를 가져 조건에 따라 RNA pol을 [[서로 다른|다른|different]] start site로 보냄 {src:야마,PPT}
- core enzyme = α<sub>2</sub>ββ′ω (α가 [[2|두|2개]]개) → core + σ = [[holoenzyme|홀로엔자임]] ; σ는 개시 후 떨어지므로 교수님은 "5개에 σ 불포함"이라 설명 {src:vault,야마}
- β와 β′ subunit은 DNA를 감싸 쥐는 [[crab-claw|crab claw|게집게발|집게발]]-like 구조를 만들고, 사이 channel에 active site가 있음 {src:야마,PPT}
### 8.1.2 Bacterial promoters
- Promoter = RNA pol이 [[transcription|전사]]을 개시하려고 붙는 DNA 서열 (단백질이 아니라 DNA 서열!) {src:야마,PPT}
- [[TSS|transcription start site|전사개시점|전사시작점]]를 +1이라 하고, 그보다 5′ 쪽 = [[upstream|상류]]은 −, 3′ 쪽 = [[downstream|하류]]는 +로 표기 {src:야마}
- 세균 promoter의 핵심 서열은 TSS 기준 −[[10|십]]과 −[[35|삼십오]] 위치의 각 6 nt {src:야마,PPT}
- −35 consensus = [[TTGACA]] / −10 consensus (Pribnow box) = [[TATAAT]] {src:vault,PPT}
- [[consensus|컨센서스|consensus sequence]] sequence = 여러 promoter에서 가장 흔히 발견되는 염기 → 변형되면 전사 효율↓, 돌연변이는 promoter 기능에 영향 {src:야마,PPT}
- σ는 −10과 −35 [[두 곳|둘 다|both|양쪽|2곳]] 모두에 결합 {src:야마,PPT}
- −10의 TATAAT는 A–T가 수소결합 [[2|두|2개]]개라 약해서 DNA unwinding에 유리 (GC는 3개) {src:야마}
### 8.1.3 Elongation and termination
> 개시(closed → open complex) → σ 방출 → 신장 → 종결 (hairpin 또는 Rho)
- RNA pol이 DNA를 따라 지나다 σ가 promoter를 인식해 결합 → DNA가 풀리지 않은 상태 = [[closed|closed-promoter|closed promoter]]-promoter complex {fire:25-1} {fire:19-1} {fire:16이전-1} {src:야마,기출,PPT}
- RNA pol이 [[12–14|12~14|12-14]] 염기를 풀어 open-promoter complex 형성 → 단일가닥이 되어 transcription 가능 {fire:25-1} {fire:16이전-1} {src:야마,기출,PPT}
- open complex가 덮는 DNA 영역은 약 [[60|60bp]] bp {src:야마}
- NTP가 약 [[10|10nt|10개]] nt 합성되면 σ가 pol에서 분리됨 {star:교수 강조} {src:야마,PPT,vault}
- Elongation 중 pol은 약 [[15|15bp]] bp의 unwound region을 유지하고, 그중 RNA–DNA hybrid는 [[8–9|8~9|8-9]] 염기 {src:야마,PPT}
- RNA는 template와 antiparallel하게 [[5′→3′|5'→3'|5to3]] 방향으로 합성, template 가닥은 3′→5′로 읽힘 {src:야마}
- 종결 signal ①: [[GC-rich|GC rich|GC가 많은|GC풍부]] [[inverted repeat|inverted|역방향 반복|역반복]] 뒤에 A 연속 7개 → 전사되면 RNA가 stem-loop 형성 {fire:19-2} {fire:16이전-8} {src:야마,기출,PPT}
- stem-loop(hairpin)가 RNA–DNA template 결합을 방해하고, 뒤따르는 U 7개는 A–U 결합이 약해 RNA가 쉽게 떨어짐 → [[rho-independent|rho independent|rho 비의존]] 종결 {src:야마}
- 종결 signal ②: 특이 종결 단백질 [[Rho|ρ|로]]가 길게 노출된 [[single-stranded|단일가닥|ssRNA|single stranded]] RNA에 결합해 종결 → rho-dependent {fire:17-3} {fire:22-1} {src:야마,기출,PPT}
- 세균 전사의 개시에만 특이적인 단백질은 [[σ|sigma]], 종결에만 특이적인 단백질은 [[Rho|ρ]] {fire:22-1} {src:기출}
- 세균 전사 조절의 대부분은 [[initiation|개시]] 단계에서 일어남 (lac operon은 ch09) {src:PPT}
## 8.2 Eukaryotic RNA Polymerases and General Transcription Factors
> 진핵은 pol 3종 + 개시 인자가 필요하고 크로마틴 위에서 일어난다 (PPT 33-52)
### 8.2.1 Eukaryotic RNA polymerases
- 진핵 전사의 특징 ①: RNA pol이 [[3|세|3종|three|3개]]종류이고 각각 다른 유전자군을 전사 {src:야마,PPT}
- 특징 ②: 개시·조절에 pol 외의 [[additional|추가|추가적인]] 단백질과 상호작용 필요 / 특징 ③: 전사는 [[chromatin|크로마틴|nucleosome]] 위에서 일어남 {src:야마}
- 핵 안 RNA pol 외에 [[mitochondria|미토콘드리아|mitochondrial]]와 chloroplast도 자체 RNA pol을 가짐 (세균과의 공생 증거) {src:야마,PPT}
- 진핵 pol은 [[12–17|12~17|12-17]]개의 subunit으로 이루어진 복합 효소 (E. coli는 5개) {src:야마,PPT}
- 모든 진핵 pol이 공유하는 conserved subunit [[9|아홉|9개]]개 중 [[5|다섯|5개]]개가 세균 RNA pol과 유사 → yeast Pol II 구조는 세균 pol과 닮음 {src:야마,PPT}
- RNA pol [[I|1|pol1]]이 전사: rRNA 5.8S, 18S, 28S (45S pre-rRNA로 한 번에 만들고 절단) {fire:25-6} {fire:20-5} {fire:16-16} {star:교수가 반드시 외우라 함} {src:야마,기출,PPT}
- RNA pol [[II|2|pol2]]가 전사: mRNA, miRNA, lncRNA, snRNA(대부분), scRNA {fire:22-6} {fire:18-2} {fire:17-5} {src:야마,기출,PPT}
- RNA pol [[III|3|pol3]]가 전사: tRNA, [[5S|5s rrna|5srrna]] rRNA, snRNA(U6 등), scRNA {fire:25-6} {fire:23-5} {fire:21-3} {src:야마,기출,PPT}
- scRNA = [[small cytoplasmic RNA|small cytoplasmic|소세포질 RNA]] / snRNA = small nuclear RNA / lncRNA = long non-coding RNA / miRNA = micro RNA {src:야마}
- Pol I은 가장 왕성하게·조절 거의 없이 전사, Pol II는 종류가 가장 다양하고 조절을 [[가장 많이|가장 많이 받는|most]] 받음, Pol III가 만드는 RNA는 크기가 가장 [[작다|작음|small]] {src:야마}
- 기출 매칭(2019/2020): 6개 pol 순서 II, II, II, III, I, III — mRNA·snRNA 대부분은 Pol II, 5S rRNA·tRNA·U6는 Pol III {fire:20-5} {fire:19-5} {src:기출}
### 8.2.2 General transcription factors and initiation of transcription by RNA polymerase II
> TFIID → TFIIB → TFIIF+Pol II → TFIIE → TFIIH, 그리고 TFIIH의 두 활성
- Pol II는 세균 σ와 달리 pol에 결합해 있지 않은 별도의 [[initiation|개시|transcription factor|전사인자]] factor가 있어야 전사를 개시 {src:야마,PPT}
- 진핵 promoter의 요소: TATA box, [[Inr|initiator|initiator element]], BRE (TFIIB recognition element), downstream element DCE·MTE·DPE {src:야마,PPT}
- TATA box는 TSS 약 −[[25|25~30|30|-25]]~−30 위치로 세균 −10 서열에 대응하며 A–T 때문에 쉽게 풀림 {src:vault,야마,PPT}
- TATA box가 없는 promoter에서는 TFIID의 [[TAF|TAFs|taf]]가 Inr·DCE·MTE·DPE에 붙어 TBP를 고정 {src:야마,PPT}
- 인간 유전체의 약 [[10|10%]]%가 transcription factor를 암호화 {src:야마,PPT}
- 모든 Pol II 전사에 쓰이는 [[general|GTF|일반]] TF와, 특정 유전자에만 관여하는 [[gene-specific|gene specific|유전자 특이적]] TF를 구분 {src:야마}
- Pol II의 GTF 5종 = TFII[[D|d]], TFII[[B|b]], TFII[[F|f]], TFIIE, TFIIH {fire:21-2} {fire:18-3} {fire:17-4} {src:야마,기출,PPT}
- TFIID = [[TBP|tata-binding protein|tata binding protein]] (TATA box에 결합) + [[TAFs|taf|TBP-associated factors|TBP associated factors]] {fire:25-7} {src:야마,PPT}
#### 조립 순서와 TFIIH
- 조립 순서 앞부분: TFII[[D|d]] → TFII[[B|b]] → TFII[[F|f]]와 Pol II가 함께 {fire:25-7} {fire:23-6} {fire:22-5} {fire:21-2} {fire:20-6} {fire:19-6} {fire:18-3} {fire:17-4} {fire:16-17} {star:반드시 외우기} {src:야마,기출,PPT}
- 조립 순서 뒷부분: … → TFII[[E|e]] → TFII[[H|h]] (마지막 도착 = Pol II를 출발시키는 인자) {fire:25-7} {fire:23-6} {src:야마,기출}
- TFIIB는 [[TBP|tbp]]와 결합하고, TFIIF는 [[Pol II|polymerase II|RNA polymerase II|pol2]]와 함께 도착 {src:야마,PPT}
- TFIIH의 두 효소 활성 = [[helicase|헬리케이스]] 활성 + [[kinase|키네이스|CTD phosphorylation|CTD 인산화]] 활성 {fire:25-7} {fire:21-4} {fire:20-6} {fire:19-6} {fire:18-4} {fire:17-9} {fire:16-18} {star:해마다 출제} {src:야마,기출,PPT}
- Helicase 활성: TFIIH subunit 중 [[2|두|2개]]개가 helicase → promoter DNA를 unwind해 closed → [[open|opencomplex|open promoter complex]] complex 형성을 도움 {src:야마,PPT}
- Kinase 활성: Pol II의 [[CTD|c-terminal domain]]의 반복서열을 인산화 → CTD와 Mediator의 결합이 약해져 Pol II가 PIC에서 분리되어 전사 시작 {fire:16이전-7} {src:야마,기출}
- TFIIH가 인산화하는 CTD residue = Ser[[5|ser5|5번]] {fire:16이전-9} {src:기출,vault}
- CTD = Pol II 큰 subunit의 C-말단 꼬리로 [[heptapeptide|7개 아미노산|7펩타이드|heptad]](7 aa) 반복 {src:vault}
- TFIIH는 DNA 손상 복구인 [[NER|nucleotide excision repair]]에서도 작용 → helicase subunit = XP[[B|b]]·XP[[D|d]] (Ch7 연결) {src:vault}
#### Mediator
- Mediator = [[20|20개|20+|스무]]개 이상의 subunit로 된 단백질 복합체로 GTF와 RNA pol 모두와 상호작용 {src:야마,PPT}
- gene-specific TF와도 상호작용해 전사를 촉진하고, Pol II의 [[CTD|c-terminal domain]]에 결합해 initiation → elongation 전환을 조절 {src:야마}
### 8.2.3 Transcription by RNA polymerases I and III
- Pol I은 [[45S|45s]] pre-rRNA 한 종류만 전사 → processing으로 5.8S, 18S, 28S 생성 {fire:22-15} {src:야마,기출,PPT}
- rRNA 유전자는 [[tandem|직렬|tandem repeat|tandem repeats]] repeat로 반복되어 있고 rRNA는 세포 RNA 중 양이 가장 많음 {src:PPT,야마}
- Pol I promoter 인식·결합 유도 factor 2종 = [[UBF|upstream binding factor]] (upstream binding factor) + [[SL1|selectivity factor 1|sl-1]] (selectivity factor 1) {src:야마,PPT}
- Pol III는 [[tRNA|트랜스퍼 RNA]], 5S rRNA, U6 snRNA, scRNA 등 짧은 RNA를 전사 {fire:23-5} {fire:21-3} {src:야마,기출,PPT}
- Pol III의 인자는 [[TFIII|TFIIIA B C|TFIIIA, B, C]] 계열 (TFIIIA, B, C와 snRNA용 SNAP) — Pol II의 TFII와 구분 {src:야마,PPT}
- 5S rRNA 유전자 promoter는 TSS의 [[downstream|하류|3′ 쪽]]에 있고 인자 = TFIIIA, B, C {fire:16이전-2} {src:야마,기출}
- tRNA 유전자 promoter도 TSS의 [[downstream|하류|3′ 쪽]]에 있고 인자 = TFIII[[B|b]], TFIII[[C|c]] {fire:16이전-2} {src:야마,기출}
- U6 snRNA 유전자 promoter는 TSS의 [[upstream|상류|5′ 쪽]]에 있고 인자 = TFIIIB + [[SNAP|snapc|SNAPc]] {src:야마}
- 5S rRNA의 조립 순서는 TFIIIA → TFIIIC → TFIIIB → Pol III, tRNA는 TFIIIC → TFIIIB → Pol III, U6는 SNAP → TFIIIB → Pol III (Pol III가 마지막에 도착; 노트 표의 "Pol, B, C, A"와 순서가 반대 — Cooper Fig 8.13 기준으로 수정) {src:PPT}
## 8.3 RNA Processing and Turnover
> 만든 RNA를 자르고·붙이고·덧씌워 완성하고, 결국 분해한다 (PPT 152-207)
### 8.3.1 Processing of ribosomal and transfer RNAs
- RNA processing = transcription 후 translation 전에 RNA를 [[mature|성숙|성숙한]] 형태로 다듬는 과정 {src:야마}
- 세균 mRNA는 전사되는 동안 바로 번역되므로 processing 불필요 (예외). 세균 rRNA·tRNA와 진핵 RNA는 [[반드시|모두|필수]] processing 필요 {fire:16이전-하20} {src:야마,기출}
- Prokaryote rRNA = single pre-rRNA → [[23S]], [[16S]], 5S {src:야마,PPT}
- Eukaryote rRNA = single [[45S|45s]] pre-rRNA → [[5.8S]], 18S, [[28S]] + 5S는 다른 유전자에서 따로 전사 {fire:22-15} {src:야마,기출,PPT}
- pre-tRNA도 prokaryote·eukaryote 모두 긴 전구체에서 processing → tRNA 구조 = [[cloverleaf|클로버잎|clover leaf]] 2차구조(stem 4개+loop 3개), 3차는 L자형 {src:야마}
- tRNA processing ①: [[RNase P|rnasep|rnase-p]]가 5′ end를 절단 — RNA가 촉매인 [[ribozyme|리보자임]] {fire:19-15} {src:야마,기출,PPT}
- ribozyme = 단백질이 아니라 [[RNA]]가 반응을 촉매하는 효소 (RNase P는 RNA–단백질 복합체, RNA가 촉매) {fire:19-15} {src:야마,기출}
- tRNA processing ②: 3′ end에 [[CCA]]를 붙여 CCA terminus 형성 = 아미노산이 결합하는 site (CCA 부착 전 3′ end는 일반 [[endonuclease|엔도뉴클레이즈|단백질 효소]]가 절단) {fire:16이전-21} {src:야마,기출,PPT}
- tRNA processing ③: 염기의 약 [[10|10%]]%가 [[modification|변형|modified]]됨 → DNA에 없는 염기 생성 (예: dihydrouridine, pseudouridine, inosine) {fire:16이전-21} {src:야마,PPT,기출}
- 일부 pre-tRNA는 intron을 가지며, tRNA splicing은 RNA 촉매가 아니라 [[endonuclease|엔도뉴클레이즈|단백질 효소]] 같은 단백질이 담당 {src:PPT}
- rRNA·tRNA는 오래 써야 하므로 매우 [[stable|안정|안정적]]하고 전체 RNA의 [[90|90%|90% 이상]]% 이상 차지 {src:야마,PPT}
### 8.3.2 Processing of mRNA in eukaryotes
- 진핵 pre-mRNA는 processing, [[transport|운반|export|수송]], translation, degradation 동안 단백질과 mRNP를 이룸 {src:야마,PPT}
- mRNP = [[messenger ribonucleoprotein particle|messenger ribonucleoprotein|mrnps]] particles {src:야마,PPT}
- mRNA processing 3단계 = 5′ [[capping|캡핑|cap]], 3′ [[polyadenylation|폴리아데닐화|poly-A tailing|polyA tailing]], [[splicing|스플라이싱]] {fire:21-5} {fire:20-16} {fire:19-15} {fire:18-15} {fire:17-15} {star:꼭 암기} {src:야마,기출,PPT}
- 전사와 processing은 [[coupled|연관|연결|couple]]되어 일어나며, 둘을 잇는 것은 Pol II의 [[CTD|c-terminal domain]] {fire:16이전-하23} {src:야마,PPT,기출}
- CTD가 인산화되면 elongation·processing 단백질을 불러오고 cap 합성효소 등의 [[binding site|결합 부위|결합자리]]가 됨 → mRNA processing은 전사 완료 후 핵에서 따로 일어나는 것이 아니라 pol과 복합체로 진행 {fire:16이전-하23} {src:야마,PPT,기출}
#### 5′ capping
- 5′ cap = [[7-methylguanosine|m7G|7-methylguanine|7methylguanosine]]가 [[5′–5′|5'-5'|5′-to-5′|5'5'|55]] 결합(triphosphate)으로 mRNA 5′ 말단에 붙음 {fire:21-5} {fire:18-15} {fire:17-15} {src:야마,기출,PPT}
- 추가로 cap 다음 첫째(또는 첫째·둘째) 뉴클레오타이드 ribose의 [[2′-O|2'-O|2′ O|2′-OH]]에 methyl group이 붙음 {src:야마}
- cap의 역할 ①: mRNA를 [[stable|안정|안정화]]하게 함 — 2′-OH 때문에 생기는 phosphate nucleophilic attack(RNA 절단)을 methyl이 막음 {src:야마,PPT}
- cap의 역할 ②: translation에서 [[ribosome|리보솜]]이 인식하는 site를 제공해 mRNA를 정렬 (조현주판 Ch10에서는 nuclear export도 포함) {src:야마,PPT,vault}
- 5′-5′ 결합이라 cap은 거꾸로 붙인 모양이고 양쪽에 3′-OH가 노출 {src:야마}
#### 3′ polyadenylation
- 3′ 말단에서 pre-mRNA 일부를 잘라낸 뒤 여러 개의 [[A|아데닌|adenine|adenosine]]를 붙여 poly-A tail 형성 {fire:21-5} {fire:18-15} {fire:17-15} {src:야마,기출,PPT}
- signal 두 가지 = hexanucleotide [[AAUAAA]] + [[GU-rich|GU rich|U-rich|GU풍부]] downstream element {fire:16이전-하24} {src:야마,기출,PPT}
- 절단은 [[CA|ca]] 염기 바로 뒤에서 일어나고, 그 뒤 [[poly-A polymerase|PAP|polyA polymerase|polyapolymerase]]가 A 약 [[200]]개를 붙임 (상황마다 크게 달라지며 200개는 드묾) {src:야마,PPT,vault}
- polyadenylation signal이 인식되면 [[transcription|전사]]이 종결되고, 절단 부위 downstream에 합성된 RNA는 분해됨 {src:야마,PPT}
- poly-A tail은 mRNA를 안정화하며, 시간이 지나면 짧아지고 짧아진 것을 인식해 노화된 mRNA를 제거 {src:야마}
- 완성된 mRNA와 pre-mRNA의 차이 3가지 = m7G [[cap|캡]], poly-A [[tail|꼬리]], [[intron|인트론]] 없음 {fire:16-23} {src:기출}
- 기출 계산(2022~2025): 전사 구간 6 kb, intron 합 2 kb, poly-A 0.2 kb → mature mRNA = 6 − 2 + 0.2 = [[4.2]] kb ; TSS~stop 사이 mRNA와 hybridize 안 하는 부분 = [[2]] kb (교수 의도는 intron 합; 해설은 전체 genomic 9 kb 기준 5 kb 계산이라 표현 괴리 있음) {fire:25-19} {fire:23-18} {fire:22-19} {src:야마,기출}
- 기출 계산 이어서: 번역되는 exon 합 3 kb = 3000 nt → 1000 codon에서 stop codon을 빼면 단백질은 [[999]]개 아미노산 {fire:25-19} {fire:22-19} {src:야마,기출}
### 8.3.3 Splicing mechanisms
> 5′ SS(GU) – branch A – 3′ SS(AG), U1 → U2, 2 step
- Splicing = pre-mRNA에서 [[intron|인트론]]을 제거하고 exon을 연결하는 과정; 포유류 유전자는 대부분 intron이 여러 개이며 pre-mRNA 서열의 [[90|90%]]% 이상이 intron {src:야마,PPT}
- splicing 연구법(in vitro): bacteriophage RNA pol의 promoter(T7·T3·SP6 등) + intron 포함 DNA를 plasmid에 cloning → [[linearization|선형화|linear]] → in vitro 전사 → 진핵 [[nuclear extract|핵추출물|핵 추출물]]에 넣어 splicing 분석 {src:야마,PPT,vault}
- 이 방법으로 snRNP가 splicing에 관여함을 제안한 연구자 = [[Lerner|Steitz|Lerner and Steitz|Lerner와 Steitz]] (1979) {src:야마,PPT}
- 중요한 pre-mRNA 서열 3곳 = 5′ splice site, 3′ splice site, intron 내부 [[branch point|branchpoint|분지점]] {src:PPT}
#### 두 단계 반응과 consensus
- Step 1: intron의 5′ SS가 잘리고, 그 5′ 말단이 intron 안의 branch point [[A|아데닌|adenine]]에 붙어 [[lariat|라리앗|올가미]] 모양 형성 {fire:21-18} {fire:20-17} {fire:19-17} {src:야마,기출,PPT}
- Step 2: [[3′|3'|3prime]] SS가 잘리면서 동시에 exon끼리 연결되고 intron lariat이 방출됨 {fire:21-18} {src:야마,기출,PPT}
- 5′ SS = intron 시작 [[GU|gt]], 3′ SS = intron 끝 [[AG]], branch point = [[A|아데닌]] (intron 처음과 끝 "GU…AG") {fire:20-17} {fire:19-17} {fire:16-24} {star:꼭 기억} {src:야마,기출,PPT}

## 9.1 Gene Regulation in E. coli
> lac operon: repressor(negative)와 CAP(positive)가 만나는 2×2 표, 그리고 cis(서열) vs trans(단백질)

#### 9.2.1.a Gene transfer assay
- 진핵 유전자의 cis-acting regulatory sequence를 찾는 실험 = [[gene transfer assay|gene transfer|transfection assay]], 조절 서열 후보를 [[reporter gene|reporter]] 앞에 붙여 reporter 발현량으로 활성 판정 {fire:19-7/20-7/22-8} {src:야마,vault,기출}
- 1단계: genomic DNA의 regulatory sequence(promoter 부위, 보통 TSS upstream 약 [[2 kb|2kb]])를 plasmid의 [[MCS|multiple cloning site]], 즉 reporter gene의 upstream에 삽입 {fire:21-20} {src:야마,vault,기출}
- 2단계: 이 plasmid를 cultured cell에 [[transfection|형질주입|transfect]] / 3단계: reporter gene의 [[발현|expression|활성]]을 측정 {fire:19-7/20-7} {src:야마,vault,기출}
- reporter gene = 쉽게 검출되는 효소를 encode하며 보통 세포에 없는 유전자 → 대표 = 반딧불이 [[firefly luciferase|luciferase|루시퍼레이스]] (β-galactosidase도 인정) {fire:22-8} {src:야마,vault,기출}
- vector 필수 3요소: [[ORI|origin of replication]] · [[selection marker|drug resistance|항생제 저항성|resistance gene]] · [[MCS|multiple cloning site]] {src:야마}
- 잘라 오는 조각의 3′ 끝: TSS는 [[포함|include]], TLS는 [[제외|exclude|미포함|포함 안 함]] → 3′ primer 위치 = [[TSS와 TLS 사이|between TLS and TSS|between TSS and TLS|TSS TLS 사이]] {fire:21-20} {star:교수 강조 - 문제 형식으로 설명} {src:야마,기출}
- TSS보다 upstream에서 끊으면 [[전사|transcription]]가 시작되지 못하고, TLS를 지나 끊으면 genomic ATG에서 번역이 먼저 시작되어 reporter가 제대로 안 만들어짐 / 둘 사이 구간 = 5′ [[UTR|untranslated region]] {src:야마}
- TSS = transcription [[start|시작]] site (+1) / TLS = translation start site (ATG) {src:야마}

#### 9.2.1.b Promoter의 cis element
- 조각을 조금씩 잘라 내거나(serial deletion) mutation을 넣어 reporter 발현이 뚝 떨어지면 그 자리에 [[positive|활성|양성]] element가 있다는 뜻 {src:야마}
- herpes simplex virus [[thymidine kinase|TK|티미딘 키네이스]] 유전자에서 두 promoter element [[TATA box|TATA]]와 [[GC box|GC]]를 발견 {fire:17-3} {src:야마,vault}
- 위치(TSS +1 기준): GC box [[-100|100]] / CAAT box [[-75|75]] / GC box [[-50|50]] / TATA box -25 {src:야마,vault}
- 서열: GC box = [[GGGCGG]] / TATA box = [[TATAA]] / CAAT box = CCAAT {src:야마}
- cis-acting regulatory sequence는 보통 TSS의 [[upstream|상류|위쪽]]에 있다 {src:야마}

#### 9.2.1.c Enhancer와 DNA looping
- [[enhancer|인핸서]] = TSS에서 멀리 떨어져 promoter 전사를 크게 stimulation하는 cis-acting regulatory sequence / [[SV40]] virus promoter 연구에서 처음 발견 (72-bp repeats) {fire:16-2/17-3} {src:야마,vault,기출}
- enhancer는 TSS와의 [[distance|거리]], [[orientation|방향]], upstream/downstream 위치와 상관없이 작동 {src:야마,vault,기출}
- 작동 원리 = DNA [[looping|loop|루핑]]: 1) enhancer에 gene-specific·tissue-specific TF 결합 {src:야마,vault}
- 2) DNA가 loop를 만들어 enhancer의 TF가 promoter의 [[Mediator|미디에이터]], GTF, RNA polymerase II(preinitiation complex)와 interaction {src:야마,vault}
- 3) promoter에 preinitiation complex가 더 잘·더 자주 형성 → 전사 ↑ / loop는 고리 모양의 [[cohesin|코헤신]]이 안정화 {src:야마,vault}
- immunoglobulin enhancer는 [[B lymphocyte|B cell|B 림프구]]에서만 작동 → cis element와 그 세포의 trans factor가 동시에 있어야 조절 / heavy-chain enhancer는 약 200 bp 안에 최소 [[9|9개]]개의 protein-binding site {src:야마}
- enhancer는 human genomic DNA의 [[10%|10]] 이상을 차지하고, 질병 관련 mutation의 다수가 coding sequence가 아닌 enhancer에 있음 / 한 유전자를 multiple enhancers가 함께 조절 {src:야마}

#### 9.2.1.d Insulator, TAD, CTCF
- enhancer는 거리와 무관하지만 같은 [[TAD|topologically associating domain|topologically associated domain]] 안의 promoter에만 작용 (TAD = 서로 독립된 chromosomal domain) {fire:17-6/18-4/21-13} {src:야마,vault,기출}
- [[insulator|인슐레이터]] = chromosome을 독립된 domain(TAD)으로 나누어 enhancer가 인접 domain의 promoter에 작용 못 하게 하는 DNA sequence → [[cis]]-acting element {fire:22-9} {src:야마,vault,기출}
- insulator에 결합하는 vertebrate의 주된 단백질 = [[CTCF]] → [[trans]]-acting factor / insulator 자리에는 CTCF와 [[cohesin|코헤신]]이 결합 (vault: TFIIIC도 결합) {fire:17-6/18-4/21-13} {src:야마,vault,기출}
- 정리 세트(답 3개): domain = [[TAD]] / cis-acting control element = [[insulator]] / trans-acting control element = [[CTCF]] {fire:17-6/18-4/21-13} {src:야마,기출}
- enhancer의 유전자 특이성을 제한하는 cis-acting element = [[insulator]] {fire:22-9} {src:기출}

### 9.2.2 Transcription factor binding sites
#### 9.2.2.a EMSA (in vitro)
- [[EMSA|electrophoretic mobility shift assay|electrophoretic-mobility shift assay]] = 찾아낸 regulatory sequence에 TF가 결합하는지 [[in vitro|시험관]]에서 확인 / 다른 이름 gel [[retardation|shift|retardation assay|gel shift]] assay {fire:16-3/18-3/19-8/20-8/22-13/23-8/25-9} {src:야마,vault,기출}
- 1) 추정 binding site를 포함한 짧은 DNA fragment(약 20 nt)의 한쪽 끝을 [[radiolabel|방사성 표지|radioactive label|radiolabeled]] {src:야마,vault}
- 2) 이 DNA를 단백질(nuclear extract)과 함께 incubate한 것과 단백질 [[없이|without|없는]] incubate한 것으로 나눔 {src:야마,vault}
- 3) electrophoresis 후 [[autoradiography|오토라디오그래피]]: free DNA는 빨리 내려가고, DNA-protein complex는 이동이 느려 위쪽에 band (= mobility [[shift|시프트]]) {src:야마,vault}
- 추정 TF의 antibody를 함께 넣으면 DNA–단백질–antibody가 더 커져 band가 더 위로 = [[supershift|슈퍼시프트]] / 결합을 방해하면 band가 [[사라짐|없어짐|disappear]] {src:야마,vault}

#### 9.2.2.b Binding site의 성질과 pictogram
- TF binding site는 보통 [[6-10|6~10|6–10]] bp(4~12)의 짧은 DNA sequence이고 [[degenerate|퇴화]] → consensus에서 한두 자리 달라도 결합 {src:야마,vault}
- 알려진 결합 서열의 염기 빈도를 막대로 나타낸 그림 = [[pictogram|logo|sequence logo]] {src:야마,vault}
- AP1 = [[Jun]] family + [[Fos]] family dimer, 핵심 서열 [[TGAC]] {src:야마,vault}
- [[Myc]] = oncogene 산물로 cancer를 유발하는 TF / [[SRF|serum response factor]] = serum의 growth factor에 반응하는 유전자의 [[SRE|serum response element]]에 결합 {src:야마,vault}

#### 9.2.2.c ChIP (in vivo)
- [[ChIP|chromatin immunoprecipitation|chip]] = 세포 안([[in vivo|생체 내]])에서 TF가 genome의 어느 서열에 실제 결합해 있는지 알아내는 실험 {fire:16-3/17-7/18-3/19-9/20-9/21-14/22-14/23-8/25-9} {src:야마,vault,기출}
- 1) [[formaldehyde|포름알데하이드|포름알데히드]]로 처리해 TF와 DNA를 cross-link {src:야마,vault}
- 2) chromatin을 추출해 잘게 fragmentation ([[sonication|초음파|초음파 처리]], 약 200~500 bp) {src:야마,vault}
- 3) 목표 TF에 specific한 [[antibody|항체]]로 immunoprecipitation (antibody가 없으면 Myc 같은 [[tag|태그]]를 붙여 발현시키고 tag antibody 사용) {src:야마,vault}
- 4) [[reverse cross-link|reverse crosslink|cross-link 제거|crosslink 풀기]]로 DNA만 정제 {src:야마,vault}
- 5) 분석: 추정 TFBS에 primer를 짜서 개별 확인 = [[PCR]] / 딸려 온 fragment 전부를 microarray·high-throughput [[sequencing|NGS|시퀀싱]]로 분석 = [[genome-wide analysis|genome wide analysis|genome-wide]] {fire:19-9/20-9/21-14/22-14} {src:야마,vault,기출}
- 정리 세트: in vitro = [[EMSA]] / in vivo = [[ChIP|chromatin immunoprecipitation]] {fire:16-3/18-3/22-13/23-8/25-9} {src:야마,기출}

### 9.2.3 Transcriptional regulatory proteins
#### 9.2.3.a DNA-affinity chromatography
- 처음 분리된 TF 중 하나 = [[Sp1|specificity protein 1]], SV40 promoter의 [[GC box|GC]]에 결합하는 activator (Tjian) {src:야마,vault}

#### 9.2.3.b Activator의 구조와 DNA-binding domain
- activator = 독립된 두 domain: [[DNA-binding domain|DBD|DNA binding domain]] + [[activation domain|활성화 도메인|활성 도메인]] {fire:25-13} {src:야마,vault,기출}

- 방법 1: [[Mediator|미디에이터]] 및 [[general transcription factor|GTF|general TF]]와 protein–protein interaction으로 pre-initiation complex에 직접 작용 {fire:19-10/20-10} {src:야마,vault,기출}

- passive repressor: activator가 붙을 자리에 대신 결합해 [[competition|경쟁|경쟁적 결합]] → [[DNA-binding domain|DBD|DNA binding domain]]만 있으면 됨 {fire:18-2} {src:야마,vault,기출}

### 9.2.4 Regulation of elongation
- (Ch8 GTF) initiation: TFIIH가 CTD의 [[Ser5|serine5|serine-5|S5]]을 인산화하면서 Pol II 출발 {src:야마,vault}

## 9.3 Chromatin and Epigenetics
> 같은 DNA라도 포장·표지로 켜고 끄며, 그 표지는 세포분열 후에도 전달된다

### Chromatin 기본 구조
- nucleosome core = [[147|147bp]] bp DNA가 histone [[octamer|옥타머|8량체]]를 감음 / octamer = H2A, H2B, H3, H4 [[각 2개|2개씩|2|두 개씩]] {fire:23-12} {src:야마,vault,PPT,기출}
- nucleosome core particle에 histone [[H1]] 한 분자가 결합 = [[chromatosome|크로마토솜]] (H1은 DNA를 묶어 안정화) {fire:23-12} {src:야마,vault,PPT,기출}
- nucleosome 직경은 약 [[11 nm|11nm|11]] {fire:23-12} {src:야마,기출}
- 전사가 일어나지 않는 compact한 영역 = [[heterochromatin|헤테로크로마틴]] / 풀려 있고 전사가 활발한 영역 = [[euchromatin|유크로마틴]] (Drosophila [[polytene|폴리틴]] chromosome에서 decondensed 영역) {src:야마,vault,PPT}
- chromatin 구조 변화의 두 요인: ① [[histone modification|히스톤 변형]] ② [[nucleosome rearrangement|nucleosome 재배치|chromatin remodeling]] {src:야마,vault,PPT}
- histone modification의 두 작용 방식: chromatin 구조·포장 상태 변화 + 특정 단백질의 [[binding site|결합 자리|결합 부위]] 제공 {src:야마,vault,PPT}

### 9.3.1 Histone modification
#### 9.3.1.a Histone acetylation
- histone N-terminal tail은 [[lysine|Lys|K|리신]]이 풍부해 acetylation이 쉽게 일어남 {fire:19-1} {src:야마,vault,PPT}
- acetylation → lysine의 positive charge가 [[중화|neutralize|0|없어짐]] → 음전하 DNA와의 결합력 ↓ → chromatin [[relax|이완|풀림]] → 전사 ↑ {fire:22-10/23-9/25-10} {src:야마,vault,PPT,기출}
- acetyl group을 붙이는 효소 = [[HAT|histone acetyltransferase]] (coactivator, 전사 [[활성|ON|촉진]]) {fire:16-21/17-9/18-6/19-11/20-12/21-10} {src:야마,vault,기출}
- acetyl group을 떼는 효소 = [[HDAC|histone deacetylase]] (corepressor, 전사 [[억제|OFF|저해]]) {fire:16-21/17-9/18-6/19-11/20-12/21-10} {src:야마,vault,기출}
- 전사 activator는 [[HAT]], repressor는 [[HDAC]]와 연결 / histone tail은 K·R이 많아 +, DNA는 phosphate 때문에 – 전하 {src:야마,PPT}

#### 9.3.1.b Methylation 등 다른 변형과 H3 tail
- 그 밖의 변형: Lys·Arg [[methylation|메틸화]], Ser [[phosphorylation|인산화]], Lys에 [[ubiquitin|유비퀴틴]]·SUMO 첨가 {src:야마,vault,PPT}
- H3K[[4]] methylation → active / H3K[[9]], H3K[[27]] methylation → inactive(heterochromatin) {fire:22-12/23-11/25-12} {star:교수 강조 - K9·K27 특히 중요} {src:야마,vault,기출}
- H3K9 acetylation과 H3S10 phosphorylation은 [[active|활성]] 표지 → 같은 K9라도 acetylation이면 active, methylation이면 [[inactive|비활성|억제]] {src:vault}

- Promoter의 H3K4 modification = [[trimethylation|trimethyl|H3K4me3|me3]] / Enhancer의 H3K4 modification = [[monomethylation|monomethyl|H3K4me1|me1]] {fire:18-10/19-12/20-13/23-13/25-14} {star:교수 강조} {src:야마,vault,PPT,기출}

### 9.3.2 Chromatin remodeling factors
- chromatin remodeling factor = DNA와 histone 사이의 접촉을 바꾸는 protein [[complex|복합체]] (= nucleosome rearrangement) {src:야마,vault,PPT}

### 9.3.3 Histones and epigenetic inheritance
#### 9.3.3.a Histone modification의 유전
- [[epigenetic inheritance|후성유전|epigenetics]] = DNA 서열에 없는 정보의 전달 / 대표 기전 세 가지 = [[histone modification|히스톤 변형]], [[DNA methylation|DNA 메틸화]], noncoding RNA {fire:16-22/18-7/23-14} {star:영어 이름 + 메커니즘 (1-53:30)} {src:야마,vault,PPT,기출}

- 예: Drosophila의 특정 regulatory gene은 발달 중 repress되고 다음 분열·세대에도 유지 ← H3 [[lysine 27|K27|Lys27|리신 27]] methylation by [[Polycomb|Polycomb protein|PcG]] protein {fire:17-10/18-8/21-12/22-12/23-11/25-12} {src:야마,vault,PPT,기출}

## 10.1 Translation of mRNA
> mRNA를 읽어 단백질을 만든다 — 재료(tRNA·ribosome·mRNA) → 개시 → 신장·종결 → 조절

### 10.1.1 Structure of tRNAs and aminoacyl-tRNA synthetase
- mRNA는 [[5′→3′|5'→3'|5to3]] 방향으로 읽히고, polypeptide는 [[N→C|amino→carboxy|N-terminus에서 C-terminus]] 방향으로 합성된다 {src:PPT,야마}
- tRNA 길이 = [[70~80|70-80|7080]] nt → 2D [[cloverleaf|클로버잎|클로버]] 구조 → 3D [[L|L자|L-shape]]자 모양 (ribosome에 맞게 compact) {src:vault,야마,PPT}
- ⭐ tRNA의 두 핵심 부위: 3′ [[CCA]] 말단 맨 끝 [[adenosine|A|아데노신]]의 ribose에 아미노산이 공유결합 / [[anticodon loop|anticodon|안티코돈 루프]]가 mRNA codon에 결합 {fire:16/25-1} {star:교수 '중요한 2가지 부분'} {src:vault,야마,PPT}
- tRNA의 기능 2가지 (2025-1): 아미노산과 결합해 [[운반|transport|carry]] + mRNA의 [[codon|코돈]]과 결합 {fire:25-1} {src:야마,기출}
- 아미노산을 tRNA에 붙이는 효소 = [[aminoacyl-tRNA synthetase|aminoacyl tRNA synthetase|synthetase]] → 종류 수 = 아미노산 수 = [[20|20개|20종]] {fire:17/18/19/20/25} {src:vault,야마,PPT}
- (심화) ATP가 관여하는 합성 효소는 [[synthetase]], ATP가 관여하지 않으면 synthase {src:야마}
- 1단계: 아미노산의 [[carboxyl|카복실|carboxyl group]]기(nucleophile)가 ATP의 [[α|alpha|알파]]-phosphate(electrophile)를 공격 → aminoacyl-AMP + [[PPi|pyrophosphate|diphosphate]] {src:vault,야마,PPT}
- 2단계: tRNA 3′ adenosine의 [[3′-OH|3'oh|OH|hydroxyl]](nucleophile)가 aminoacyl기의 [[carbonyl carbon|carbonyl C|카보닐 탄소|carbonyl]](electrophile)를 공격 → [[AMP]] 이탈 → aminoacyl-tRNA(charged tRNA) 완성 {src:vault,야마,PPT}
- 예: tRNA와 아미노산은 [[tyrosyl-tRNA synthetase|tyrosyl tRNA synthetase|TyrRS]]의 active site에서 만나고, 완성된 charged Tyr-tRNA는 synthetase에서 [[분리|해리|떨어짐]]된다 {src:vault}
- 🔴 Nucleophilic substitution = electron-rich한 [[nucleophile|친핵체]]가 electron-deficient한 electrophile을 공격해 새 공유결합을 만들고 [[leaving group|이탈기]]를 대체하는 반응 → synthetase · peptidyl transferase · release factor 세 반응의 공통 원리 {star:교수 강조} {src:vault,야마,PPT}

### 10.1.2 Codon and nonstandard codon-anticodon base pairing
- codon 조합 = 4×4×4 = [[64|64개]]개, 그중 단백질을 암호화하는 sense codon = [[61|61개]]개 (stop codon 3개 제외) {fire:22/23} {src:vault,야마,PPT}
- initiation codon = [[AUG]] → 아미노산 [[Met|methionine|메티오닌]] (원핵·진핵 모두 번역은 항상 이것으로 시작) {src:vault,야마,PPT}
- stop codon 3개 = [[UAA]] · [[UAG]] · UGA — 대응하는 tRNA가 없고 [[release factor|RF|eRF]]가 인식 {fire:23-3/22-16} {src:야마,기출}
- UGG(Trp)가 UGA로 바뀌면 그 지점에서 [[종결|termination|stop|번역 종결]]되어 앞까지만 합성된다 (기종평 2023-23: UGA = 종결 codon) {fire:23-기종평23} {star:교수 '외워놔야'} {src:vault,야마}
- 세포에는 tRNA가 약 [[40|40종|40개]]종뿐 → 61개 sense codon을 다 읽으려면 일부 tRNA가 여러 codon 인식 (cytosolic rRNA는 [[4|4종]]종) {fire:22-12/23-17} {src:야마,PPT,기출}
- 한 tRNA가 여러 codon을 읽는 현상 = [[wobble|워블]] : codon의 [[3번째|세 번째|third|3rd]] 염기에서 nonstandard base pairing 허용 {fire:16/25-2} {src:vault,야마,PPT}
- wobble은 anticodon의 [[첫 번째|first|1번째|5′ 끝]] 염기(특정)가 codon의 세 번째 염기(여러 종류)와 짝짓는 것 {src:야마}
- Phe-tRNA anticodon의 [[G]]는 codon의 C뿐 아니라 [[U]]와도 짝 (G≡C 외에 G=U) {src:vault,야마,PPT}
- Ala-tRNA의 modified base inosine(I)는 codon의 [[A]] · [[C]] · [[U]]와 짝 (I=A/C/U) {fire:17/18/19/20/21/22/23/25} {src:vault,야마,PPT,기출}
- anticodon의 U는 codon의 [[A]] · [[G]]와 짝 (2023-7: 시험지에는 U 대신 I로 오타 → 정답 U·C·A) {fire:23-7} {src:야마,기출}

### 10.1.3 Ribosome structure
- 모든 ribosome은 [[2|두|2개]]개의 subunit (large + small)를 가지며, 각 subunit = [[rRNA]] + ribosomal protein 복합체 {src:vault,야마,PPT}
- 원핵: 50S + 30S → [[70S|70]] ribosome / 진핵: 60S + 40S → [[80S|80]] ribosome {fire:15} {src:vault,야마,PPT}
- 원핵 small subunit의 rRNA = [[16S|16s|16]] / 진핵 small subunit의 rRNA = [[18S|18s|18]] {fire:21} {src:vault,야마,기출}
- 진핵 large(60S) subunit의 rRNA = [[28S]] · [[5.8S]] · 5S / 원핵 large(50S) = 23S · 5S {src:vault,야마}
- S = [[Svedberg|svedbergunit|스베드베리]] unit = [[sedimentation rate|침강계수|침강 속도|sedimentation]] → 단순히 분자량에 비례하지 않는다 {src:vault,야마,PPT}
- ⭐ 왜 60S + 40S = 80S ≠ 100S? S값은 분자량 외 요인(점도 등)과 입자의 [[shape|형태|모양]]에 영향을 받고, ribosome은 완벽한 [[구형|sphere|sphere 아님]]이 아니기 때문 {fire:25-3} {star:교수 수업 중 질문} {src:야마,기출}
- Ribosome 분리: HeLa lysate를 [[sucrose|sucrose density gradient]] density gradient에 올려 [[ultracentrifugation|초원심분리]] → S가 큰 입자일수록 아래쪽으로 / rRNA는 UV([[260|260nm]] nm)를 흡수해 흡광도 peak로 확인 {src:vault,야마,PPT}
- 흡광도 peak 순서: 40S → 60S → [[80S]] → 그 뒤의 작은 peak들 = [[polysome|polyribosome|폴리솜]] {src:vault,야마}
- rRNA의 기능 2가지 = structural [[scaffold|스캐폴드|뼈대]] + catalytic activity ([[ribozyme|리보자임]]; large subunit의 [[peptidyl transferase]]) {fire:16/17/18/25} {src:vault,야마,PPT,기출}
- 사람 80S ribosome (cryo-EM, HeLa) = ribosomal protein 약 [[80|80개]]개 + rRNA [[4|4종]]종 / 단백질 이름 uL18의 u = [[universal|유니버설]], L = large subunit (e = eukaryotic) {src:PPT,야마}

### 10.1.4 Organization of mRNAs and signals for translation initiation
- 번역되지 않는 양 끝 부위 = [[UTR|untranslated region]] (5′ UTR, 3′ UTR) {src:vault,야마,PPT}
- 진핵 mRNA는 대부분 [[monocistronic|mono-cistronic|모노시스트로닉]], 원핵 mRNA는 [[polycistronic|poly-cistronic|폴리시스트로닉]] → 각 유전자마다 독립된 개시 서열 {src:vault,야마,PPT}
- 진핵 mRNA 보호: 5′ 끝 = [[7-methylguanosine|m7G|7-methylguanosine cap]] cap / 3′ 끝 = [[poly-A|polyA|poly A]] tail {fire:17/18/19/20/22/23} {src:vault,야마,PPT}
- cap과 poly-A tail의 공통 역할 3가지: [[exonuclease|엑소뉴클레아제]] 분해 방지 · [[nuclear export|핵외수송|핵 수송|export]] 촉진 · translation 촉진 {fire:} {src:vault,야마,PPT}
- ribosome이 initiation factor를 매개로 직접 recruit되는 자리 = 5′ [[cap]] (poly-A의 PABP는 eIF4G를 통한 간접 연결) (기종평 2023-3: 정답 5′ capping) {fire:23-3/22-16} {src:야마,기출}
- 원핵 개시 signal = [[Shine-Dalgarno|shinedalgarno|SD]] sequence (5′-[[AGGAGG]]-3′), small subunit의 [[16S]] rRNA 3′ 말단 부근과 상보적 {fire:17/21} {src:vault,야마,PPT}

- ALS (Lou Gehrig병) = [[TDP-43|tdp43|TDP43]]의 cytoplasmic mislocalization·aggregation → [[motor neuron|운동뉴런|운동 뉴런]] 점진적 소실, 발병 후 3~5년 {src:vault,야마,PPT}
- ALS와 관련된 단백질 = [[SOD1|superoxide dismutase|SOD]](superoxide dismutase)와 TDP-43 {src:vault}
- Prion disease = [[prion|프리온|prion protein]] 단백질 (소 BSE · 양 [[scrapie]] · 사람 [[CJD|Creutzfeldt-Jakob]]) {fire:18/19/20} {src:vault,야마,기출}
- Huntingtin의 Cys 214 palmitoylation은 aggregation을 [[억제|inhibit|방지]]한다 (10.3.2 lipidation 연결) {src:PPT,야마}

#### 비신경퇴행성·전신 질환
- Type 2 diabetes = [[IAPP|amylin|islet amyloid polypeptide]]가 췌장 islet [[β-cell|beta cell|베타세포|β cell]]에서 응집 → β-cell 기능 저하·사멸 → insulin 분비 감소 {fire:25-9} {src:vault,야마,PPT}
- T2D: [[인슐린 저항성|insulin resistance]] → 혈당을 낮추려고 β-cell이 insulin과 IAPP를 더 많이 분비 {src:PPT}
- insulin이 proinsulin에서 만들어지듯 IAPP도 [[proIAPP]]에서 가공되어 생성됨 {src:vault}
- 백내장(Cataract) = 수정체 [[crystallin|크리스탈린]] 응집 (α·β·γ 세 종류) {fire:16/20/25-9} {src:vault,야마,PPT}
- [[α-crystallin|alpha-crystallin|alphacrystallin]]은 chaperone 역할 → 기능이 떨어지면 β/γ-crystallin 응집 증가 (노화 시 소실) {src:야마,PPT}
- α-crystallin 자체도 기질과 함께 또는 단독으로 [[aggregation|응집]]될 수 있다 {src:vault}
- AL amyloidosis = 면역글로불린 [[light chain|lightchain|light]]이 mutation으로 folding이 불안정해져 amyloid fibril이 되고 장기(심장·신장·간 등)에 축적 {src:vault,야마,PPT}
- AL: 환자의 70–80%에서 B cell clone이 [[λ|lambda]] light chain 생산, 가변부(IGLV) 유전자의 somatic mutation → 낮은 folding stability {src:PPT}
- 표 10.1 추가: injection-localized amyloidosis = [[insulin]] / Amyloid A amyloidosis = serum amyloid A / senile systemic amyloidosis = [[transthyretin|TTR]] {src:야마}
- 단백질 응집 질환이 아닌 것: [[Cancer|암|종양]] (2020~2023 거의 매년) · [[ferritin deficiency anemia|ferritin|ferritin 결핍 빈혈]] (2025-9) {fire:20/21/22/23/25-9} {src:기출,야마}

#### Amyloid fibril 검출 (염색)
- ⭐ 교수 강조(기종평 출제): amyloid fibril 검출 형광 dye 3가지 = [[Thioflavin T|ThT]] · [[Thioflavin S|ThS]] · [[Congo red|congored|콩고레드]] {star:교수 '기종평에 나온다'} {src:야마,PPT}
- 세 dye는 특정 단백질이 아니라 fibril 구조(cross-[[β|beta]]-sheet)에 결합 → 어떤 단백질이든 fibril이면 검출, 공통점 = [[aromatic ring|방향족 고리|aromatic]] {src:야마,PPT}
- 용액(solution)에서 fibril 형성 확인 = ThT (형광 ~[[480]] nm) / ThS (~[[520]] nm) {src:vault,야마,PPT}
- ThT는 AD·PD·ALS의 amyloid fibril을 [[모두|전부|all]] 검출한다 {src:vault}
- 조직(tissue) 염색 = [[Congo red|congored]] / 교수님: 「Congo red로 조직 염색」이 나오면 무조건 amyloid fibril 축적 질환 {star:교수 강조} {src:vault,야마}
- Congo red: 조직 염색, 흡광 peak ~[[614]] nm / bright field에서는 [[빨간색|빨강|red]], fluorescence microscopy에서는 [[빨간 형광|빨강 형광|red fluorescence]] {src:vault}
- Congo red + 편광(polarized light) → [[apple-green birefringence|applegreenbirefringence|apple green 복굴절]] (bright field는 빨강) {fire:24-기종평23/25-기종평41} {src:야마,PPT}
- 기종평 2024-23 · 2025-41: 신장 조직에서 Congo red 양성 → 진단 = [[amyloidosis|아밀로이드증|아밀로이드증(amyloidosis)]] {fire:24-기종평23/25-기종평41} {src:vault,야마,PPT}
- H&E 염색: hematoxylin은 음전하 산성 구조(nucleus·[[ribosome]]·rough ER), eosin은 [[양전하|positive|양전하(+)]] amino acid에 결합 {src:PPT}

### 10.2.5 Enzymes that catalyze protein folding
- 단백질 folding을 촉진하고 folding intermediate를 안정화해 chaperone처럼 작용하는 효소 2가지 = [[PDI]] · [[PPI]] {src:vault,야마,PPT}
- [[PDI|protein disulfide isomerase]] = ER에서 cysteine의 –SH를 disulfide bond([[S–S|ss|disulfide|이황화결합]])로 바꿈 {fire:15} {src:vault,야마,PPT}
- ER는 [[oxidizing|산화|산화적]] 환경이라 S–S 형성에 유리 / cytosol은 [[reducing|환원|환원적]] 환경이라 –SH 유지 → S–S는 주로 분비 단백질·일부 막 단백질에 존재 {src:야마,PPT}
- PDI는 잘못 형성된 disulfide bond를 끊고 다시 연결해 주는 [[isomerase|재배열|이성질화]] 기능도 한다 {src:야마}
- [[PPI|peptidyl prolyl isomerase]] = proline 앞 peptide bond의 [[cis–trans|cis-trans|cis trans]] isomerization 촉매 {src:vault,야마,PPT}
- proline은 ring 구조라 회전이 제한되어 chain이 꺾이고, cis↔trans 전환이 느려 folding의 [[rate-limiting|속도 결정|율속]] 단계가 될 수 있음 → PPI가 가속 {src:야마,PPT}
- 서술형 대비 (2018-9) 단백질 변형 종류: disulfide 형성 / peptidyl [[prolyl isomerization|prolyl isomerase|isomerization]] / [[proteolysis|protein cleavage]] / [[glycosylation]] / [[lipid attachment|lipidation]] {fire:18-9} {src:기출}

### 10.2.6 Protein cleavage (Proteolysis)
- 단백질 성숙을 위한 cleavage 3가지: [[NME|N-terminal methionine excision]] · [[signal sequence|signal peptide]] cleavage · insulin 가공 {src:vault,야마,PPT}
- NME: 새로 합성된 단백질의 N-말단 [[Met|methionine]]을 제거 (stability·folding·function 보장, co-translational) {src:야마,PPT}
- NME 효소 = [[methionine aminopeptidase|methionineaminopeptidase|metap]], 전체 단백질의 [[30~60|30-60|30–60]]%에서 일어남 {src:vault,야마,PPT}
- ER로 가는 단백질은 N-말단에 [[signal sequence|signal peptide]]를 가지며, ribosome에서 나오며 막 channel에 삽입되어 합성과 동시에 통과 = [[co-translational|cotranslational]] translocation {src:vault,야마,PPT}
- signal sequence 절단 효소 = [[signal peptidase|signalpeptidase]] (ER 막 단백질 분해효소) {fire:16-9} {src:vault,야마,기출,PPT}
- insulin = 두 사슬(A·B)이 disulfide로 연결 / 전구체에서 [[2|두|2번]]번 cleavage되어 성숙 {src:야마,PPT}
- preproinsulin (N-말단 signal + B chain + connecting peptide + A chain) →(signal 제거 + [[S–S|ss|disulfide|이황화결합]] 형성)→ [[proinsulin]] →([[C peptide|cpeptide|connecting peptide|C-peptide]] 제거)→ mature insulin {fire:15/16/19/20/23} {src:vault,야마,기출}
- signal peptide는 ER 표적 신호일 뿐 [[혈당 감지|혈당 농도 감지]] 기능이 아님 / 혈당이 높으면 췌장 [[β cell|β세포|베타세포]]에서 exocytosis로 분비 (endocytosis는 오답) {fire:19-10/20-10/23-6} {src:기출,야마}

## 10.3 Post-translational Modifications (PTMs)
> 화학기·단백질을 붙여 단백질의 활동·안정성·위치를 바꾼다

### PTMs overview (개요)
- PTM = 단백질이 합성된 뒤 일어나는 [[covalent|공유|공유결합]] 화학적 변형 / 영향: structure · function([[activity|활성]]) · interaction · [[localization|위치|세포 내 위치]] {src:vault,야마,PPT}
- ⭐ PTM의 목적 (2025-10) = regulate protein [[activity]], [[stability]] and [[localization]] (ASL) {fire:25-10} {src:vault,야마,기출}
- chemical group 부착형: [[phosphorylation|인산화]] (가장 흔함) · O-[[GlcNAcylation|O-GlcNAc]] · [[PARylation|PARylation]] · methylation · acetylation · oxidation {src:야마}
- ⚠ PARylation = poly(ADP-ribosyl)ation, 효소 [[PARP]] (교수님이 lipid라고 읽었으나 실제는 아님) {src:vault,야마}
- 단백질 부착형: [[ubiquitination|유비퀴틴화]] · [[SUMOylation|SUMO화]] / 그 외 [[proteolysis|단백질 절단]] (NME·signal peptidase·insulin) {src:야마}

### 10.3.1 Glycosylation
- Glycosylation = 단백질에 carbohydrate chain이 붙어 glycoprotein 형성 → folding · quality control · [[stability|안정성]] · [[transportation|수송|transport]]에 영향 {src:야마,PPT}
- N-linked glycosylation = [[Asn|asparagine|n|아스파라긴]]의 질소(N)에 당 결합 / O-linked = [[Ser|serine|s]] · Thr의 O에 당 결합 (Tyr 아님) {fire:19/20} {src:vault,야마,기출,PPT}
- N-linked 당 = Asn의 N에 [[N-acetylglucosamine|GlcNAc|N-acetylglucosamin]] 결합 / O-linked 당 = Ser·Thr의 O에 [[N-acetylgalactosamine|GalNAc|N-acetylgalactosamin]] 결합 {src:vault}
- glycosylation은 주로 [[ER|소포체|endoplasmic reticulum]]에서 일어남 → N-linked 당화가 있으면 그 단백질은 ER를 거친 것으로 추론 {src:vault,야마}
- N-linked는 번역이 끝나기 전([[co-translational|cotranslational]])부터 ER에서 시작 {src:PPT,야마}
- 올리고당은 ER 막의 지질 운반체 [[dolichol phosphate|dolichol|dolichol-phosphate]]에 먼저 조립된 뒤 Asn 잔기로 전달 {fire:19/20} {src:야마,기출,PPT}
- 이를 촉매하는 효소 = [[oligosaccharyltransferase|OST]] (OST) {src:야마,PPT}
- dolichol은 단백질에 지질을 전달하는 것이 아니라 [[당사슬|oligosaccharide|올리고당]]을 전달하는 carrier (2023-3 ⑤ 오답) {fire:22-16/23-3} {src:기출,야마}

### 10.3.2 Lipidation
#### 개요·N-myristoylation·prenylation
- Lipidation = 단백질에 lipid가 붙어 [[소수성|hydrophobicity|hydrophobic]]을 높여 막 위치·trafficking·상호작용·신호전달을 조절 {src:야마,PPT}
- Lipidation 4종 = N-[[myristoylation]] · [[prenylation|farnesylation]] · palmitoylation · [[GPI anchor|gpi]] (glycosylation은 lipidation이 아님) {fire:25-11} {src:vault,야마,기출}
- N-myristoylation: myristic acid([[C14|14]])가 N-말단 [[Gly|glycine|g]]에 붙음, 효소 = N-myristoyltransferase([[NMT]]) {fire:20/23} {src:vault,야마,PPT}
- prenylation: prenyl기(예 [[farnesyl|farnesylation]])가 C-말단 근처 [[Cys|cysteine|c]]의 –SH(황)에 붙음, 효소 = [[FTase|farnesyl transferase]] {fire:20} {src:vault,야마,PPT}
- (PPT, 수업에서 미설명) prenylation 후속: C-말단 [[3|세]]개 아미노산(AAX) 제거 → 남은 Cys의 carboxyl기 methylation {src:PPT,야마}
- farnesylation 예: PEX19 chaperone에 farnesyl 부착 → conformational change로 [[peroxisomal|peroxisome]] 막단백질과 더 단단히 결합 {src:PPT,야마}

#### palmitoylation·GPI anchor
- palmitoylation: palmitic acid([[C16|16]])가 [[내부|internal]] Cys의 –SH(황)에 붙음, 효소 = [[palmitoyltransferase|palmitoyl transferase]] {fire:20} {src:vault,야마,PPT}
- palmitoylation은 mutant huntingtin의 aggregation을 [[억제|inhibit|방지]]하고 polyQ 독성으로부터 세포 보호 {src:PPT,야마}
- GPI anchor = [[glycosylphosphatidylinositol|GPI|glycosyl phosphatidylinositol]] : glycolipid가 단백질 [[C-말단|C말단|C-terminal]]의 carboxyl기에 붙음 {fire:16/19} {src:vault,야마,PPT}
- 세포막 바깥쪽 표면에 단백질을 고정시키는 기가 되는 것은 GPI의 [[glycolipid|글리코리피드|당지질]] (2016-10) {fire:16-10} {src:기출}
- 정리: N-말단 Gly = myristate, C-말단 근처 Cys = [[prenyl|farnesyl]], 내부 Cys = [[palmitate|palmitoyl]], C-말단 carboxyl = GPI {src:야마,PPT}

### 10.3.3 Phosphorylation
- 인산화 효소 = [[protein kinase|kinase|키나아제]] (ATP의 phosphate를 가져옴) / 인산기를 떼는 효소 = [[phosphatase|protein phosphatase|포스파타아제]] {fire:16-12/19/20/23-14} {src:vault,야마,기출,PPT}
- 인산화되는 잔기 = [[Ser|serine]] · [[Thr|threonine]] · [[Tyr|tyrosine|y]] (side chain의 OH기) — lysine은 아님 {fire:23-14/21-9} {src:vault,야마,기출,PPT}
- protein kinase는 [[signal transduction|신호전달|신호 전달]] 경로의 핵심 / kinase 연쇄작용이 세포 표면 신호를 세포 내 표적으로 전달 {src:야마,PPT}
- epinephrine → 수용체 → adenylyl cyclase → [[cAMP]] → [[PKA|protein kinase a|cAMP-dependent protein kinase]] (cAMP-dependent protein kinase) {fire:20-12} {src:vault,야마,PPT}
- PKA가 [[phosphorylase kinase|phosphorylase]] kinase를 인산화·활성화 → 이것이 [[glycogen phosphorylase]]를 인산화·활성화 {fire:20-15} {src:야마,PPT,기출}
- 활성화된 glycogen phosphorylase가 glycogen을 [[glucose-1-phosphate|glucose 1-phosphate|G1P]]로 분해 → 혈당·근육 에너지 공급 (glycogen 합성이 아님) {src:야마,PPT,기출}

### 10.3.4 Acetylation, methylation, nitrosylation
- acetylation: acetyl기가 [[Lys|lysine|k|라이신]]에 결합 / histone에 많이 일어나 chromatin 구조·전사 조절 {src:vault,야마,PPT}
- acetyl기를 붙이는 효소 = [[KAT|lysine acetyltransferase|KATs]] (Lysine acetyltransferases) / 떼는 효소 = [[KDAC|lysine deacetylase|KDACs]] {src:야마,PPT}
- methylation: 주로 [[Lys|lysine|k]]과 Arg에 methyl기 부착, 효소 = [[methyltransferase|메틸전이효소]] / 제거 효소 = [[demethylase|demethylases]] (가역적 PTM) {src:vault,야마,PPT}
- nitrosylation: [[NO|nitric oxide|산화질소]] group이 [[Cys|cysteine|c]]의 thiol(–SH)에 결합 → S-nitrosothiol([[SNO]]) {src:vault,야마,PPT}

### 10.3.5 Ubiquitination and SUMOylation
- ubiquitin = [[76|76aa]]개 아미노산의 작은 단백질 / SUMO(Small Ubiquitin-like Modifier) = 약 [[100|100aa]]개 아미노산 {src:vault,PPT}
- 이들은 chemical group이 아니라 [[단백질|protein]] 자체를 target 단백질에 붙이는 PTM {src:야마}
- ubiquitin은 target의 [[Lys|lysine|k]] side chain의 amino기에 붙고, 이어서 더 붙어 chain을 형성 {src:vault,PPT}
- (심화) SUMOylation은 단백질의 [[위치|localization|세포 내 위치]], 안정성, 상호작용, 전사 조절에 관여 / ubiquitin은 단백질 [[분해|degradation]] 조절 단백질 (2023-13) {fire:21-8/22-8/23-13} {star:교수 강조} {src:야마,기출}
- (참고) 2017-8: 단백질이 이동할 위치를 지정하는 사건으로 출제된 정답은 [[glycosylation|glycosylation(추론형)]] (슬라이드 근거는 transportation 언급뿐) {fire:17-8} {src:기출}

## 10.4 Protein Degradation
> 다 쓴 단백질·잘못 접힌 단백질을 없애는 두 길 — UPS와 autophagy

### 10.4.1 Ubiquitin–proteasome system (UPS)
- UPS = ubiquitin이 붙은 단백질을 [[proteasome|프로테아솜]]이 분해 / 세포 단백질의 약 70–80%를 분해 (기종평 2023-10) {fire:23-기종평10} {src:야마,PPT,기출}
- E1 = ubiquitin-[[activating|activating enzyme]] enzyme (ATP로 ubiquitin 활성화) / E2 = ubiquitin-[[conjugating|conjugating enzyme]] enzyme / E3 = ubiquitin [[ligase|리가아제]] {fire:21/25} {src:vault,야마,PPT}
- 전달 순서: ubiquitin → [[E1]]에 활성화·결합 → [[E2]]로 전달 → [[E3]]가 target protein에 부착 {src:야마,PPT}
- 반복되어 [[poly|polyubiquitin|여러 개]]ubiquitin chain이 되어야 proteasome이 인식 / proteasome = 큰 protease complex {fire:16-14} {src:vault,야마,PPT}
- proteasome은 [[blender|믹서기|믹서]]와 같다 — 단백질을 선형으로 펴서 내부 protease가 잘라 냄 {fire:16} {star:교수 비유} {src:야마}
- 2016-14: proteasome = [[multisubunit|다중 subunit|multi-subunit]] protease complex로, 파괴 표지가 붙은 단백질을 분해 (vesicle·lysosome 전구체 아님) {fire:16-14} {src:기출}

### 10.4.2 Autophagy–lysosomal system
- autophagy: auto = [[self|자기]], phagy = [[eating|먹기|먹다]] (Greek) {src:PPT}
- 분해 대상 = aggregate-prone 단백질 · 병원체([[pathogen|병원균]]) · 기능 못하는 [[organelle|소기관]] (예: [[mitochondria|미토콘드리아]]) {fire:17-9} {src:vault,야마,PPT}
- lysosome = [[단일막|single membrane|1겹]]으로 싸인 소기관, 안에 protease 포함 [[acid hydrolase|가수분해효소|hydrolase]] {src:야마,PPT}
- macroautophagy 4단계: [[isolation membrane|phagophore]] 형성 → 소포 expansion → autophagosome maturation + lysosome fusion → 내용물 분해 {src:야마,PPT}
- isolation membrane(phagophore)이 기능 못하는 mitochondria를 감싼 상태 = [[autophagosome|오토파고솜]] → [[lysosome|리소좀]]과 융합 → 효소가 분해 {fire:17-9} {src:야마,PPT}
- 분해 산물은 세포 내에서 [[재사용|recycling|재활용]]됨 (교수님: 종이쓰레기 재활용 비유) {src:야마}
